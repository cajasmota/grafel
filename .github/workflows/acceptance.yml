name: acceptance

# Cross-OS release acceptance gate (#5226 / #5227, epic #5223).
#
# Proves a real grafel artifact installs, passes the functional acceptance
# ladder (`grafel selftest`), and uninstalls CLEANLY on every supported OS.
#
# Per OS the job:
#   1. Gets the binary — downloads the REAL release archive (binary + bundled
#      dashboard) built by release.yml when triggered by a release, else builds
#      it locally (dashboard SPA + `go build -tags osusergo`). We prefer the
#      released artifact so we test exactly what users get.
#   2. Installs it the way a user does — extracts into ~/.grafel/bin and puts it
#      on PATH (the same prefix install.sh/install.ps1 use; we extract the local
#      archive directly because the shell installers download from a *published*
#      release, which does not exist yet on a pre-release build).
#   3. Post-install integrity — binary on PATH, `grafel --version`, `grafel
#      doctor`, ~/.grafel created, MCP config written (`grafel install --copy`).
#   4. Runs `grafel selftest` — the functional ladder (daemon-ready → MCP →
#      cold-index → incremental → persistence → teardown). This is the heart of
#      the gate; it must exit 0. selftest is FULLY ISOLATED (its own temp
#      GRAFEL_DAEMON_ROOT + dynamic dashboard port) so it needs no service
#      manager and never touches the user/runner ~/.grafel.
#   5. Uninstalls (`grafel uninstall`) and asserts CLEAN teardown — no MCP
#      config, no install.json, prefix gone.
#
# ── #5227 trigger / cost strategy ────────────────────────────────────────────
# THIS WORKFLOW DOES NOT RUN ON PULL REQUESTS AT ALL. Read this before the
# `on:` block, before the `pr-linux` job, and before believing any other
# sentence in this file about PRs (Refs #7250):
#
#   * There is NO `pull_request` trigger here, and there is NO `paths:` filter
#     anywhere in this file. Neither has existed since the trigger was removed
#     to conserve free-tier minutes. A PR opened against this repo schedules
#     ZERO jobs from acceptance.yml — not the full matrix, and not the cheap
#     Linux-only one.
#   * The `pr-linux` job below — the one whose banner says "PR signal",
#     "cheap", "Linux-only", "paths-gated" — is DORMANT, not live. Its guard is
#     `if: github.event_name == 'pull_request'`, and this workflow can never
#     deliver that event, so the job cannot run under ANY trigger it has,
#     workflow_dispatch included. It is kept, unrun, only because the choice
#     between deleting it and restoring the trigger is an open owner decision
#     tracked with #7248 / #7250. It is not coverage. Do not cite it as PR
#     coverage, and do not assume a change to it has been tested by anything.
#     `scripts/ci/workflow_event_gate.py` holds a ticket-bearing allow-list row
#     for it; that row fails the gate the moment the job is renamed or removed,
#     so this note cannot outlive the job it describes.
#   * FULL matrix (ubuntu + windows + macos) runs ONLY after the `release`
#     workflow finishes publishing assets (workflow_run) and on manual
#     workflow_dispatch. See the `acceptance` job's `if` guard and the `on:`
#     triggers below.
#   * `concurrency` cancels superseded runs; the Go build+module cache is reused.
#
# ── macOS headless caveat ────────────────────────────────────────────────────
# GitHub macOS runners are HEADLESS, so launchd service-supervision (the
# `grafel start` → LaunchAgent path) cannot be authoritatively validated here.
# We therefore exercise the FUNCTIONAL ladder via `grafel selftest`, which runs
# its own isolated in-process daemon (no launchd). Real launchd validation
# happens on a physical Mac per the #5229 runbook.

on:
  # Release acceptance runs AFTER the `release` workflow finishes publishing the
  # assets — NOT on the tag push directly (that races release.yml, which builds
  # for ~10-12 min, so the assets aren't uploaded yet → "release asset not
  # found", which failed on EVERY tag: v0.1.7, .1, .2, .3). We use workflow_run
  # rather than `release: published` because release.yml publishes via the
  # default GITHUB_TOKEN, and GitHub suppresses `release` events created by
  # GITHUB_TOKEN (loop-prevention), so a `release:` trigger would never fire.
  workflow_run:
    workflows: ["release"]
    types: [completed]
  workflow_dispatch:
  # NO `pull_request` TRIGGER, AND NO `paths:` FILTER — deliberately, and the
  # two together are the whole story of the `pr-linux` job (Refs #7250).
  # A `pull_request` trigger was formerly here, path-gated to the
  # install/release/daemon/cmd surface. Both it and the `paths:` filter were
  # removed to conserve free-tier minutes; acceptance is now releases + manual
  # dispatch only. Consequence: the `pr-linux` job below is DORMANT — its
  # `if: github.event_name == 'pull_request'` guard matches under NO trigger
  # this workflow has. Note it is NOT reachable by dispatching this workflow
  # either: a workflow_dispatch run sets `github.event_name` to
  # 'workflow_dispatch', not 'pull_request', so that guard is false there too.
  # The ONLY thing that can revive `pr-linux` is re-adding a `pull_request`
  # trigger here (and, if the cost reasoning still holds, a `paths:` filter
  # with it) — an open owner decision tracked with #7248 / #7250.
  # The full cross-OS matrix runs post-release (workflow_run) or on
  # workflow_dispatch — unaffected by any of this.

permissions:
  contents: read

concurrency:
  # One run per release tag (workflow_run) / ref otherwise; a superseded run is
  # cancelled so we never burn minutes (2x on Windows/macOS) on a stale commit.
  group: acceptance-${{ github.event.workflow_run.head_branch || github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: '1.26'

jobs:
  # ── DORMANT — THIS JOB NEVER RUNS (Refs #7250) ─────────────────────────────
  # It was once the PR signal: a cheap, Linux-only, paths-gated build +
  # acceptance ladder. It is none of those things now, because it is not
  # anything now. Every word of that description is historical:
  #   * "PR signal"    — this workflow has no `pull_request` trigger, so the
  #                      guard below matches under no trigger it has.
  #   * "paths-gated"  — there is no `paths:` filter anywhere in this file.
  #   * "cheap"        — it costs nothing, because it never starts.
  # Whether to delete it or restore the `pull_request` trigger is an open owner
  # decision tracked with #7248 / #7250; it is left in place so that decision
  # stays open, NOT because it provides coverage. Nothing below this line has
  # run since the trigger was removed. If you are editing these steps, they are
  # untested by CI — the only way to exercise them today is to restore the
  # trigger, or to run `go build` + `grafel selftest` by hand.
  # `scripts/ci/workflow_event_gate.py` flags this guard and suppresses it via
  # one ticket-bearing allow-list row, so the dormancy is machine-checked in
  # both directions rather than resting on this comment.
  pr-linux:
    if: github.event_name == 'pull_request'  # never matches — see banner above
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # -tags osusergo matches the release build (pure-Go os/user). No dashboard
      # SPA build here — selftest does not need the embedded UI (it polls the
      # dashboard *listener*, which serves a placeholder when unbuilt), so we
      # skip the npm build to keep this job fast (it was the PR job; see the
      # DORMANT banner above — it no longer runs at all).
      - name: Build grafel
        run: go build -trimpath -tags osusergo -o /tmp/grafel ./cmd/grafel

      - name: grafel --version
        run: /tmp/grafel --version

      - name: grafel selftest (acceptance ladder)
        run: /tmp/grafel selftest

  # ── Full cross-OS acceptance matrix: post-release + manual dispatch ONLY ────
  # GUARD: the `if` below admits only workflow_dispatch and a successful
  # `release` workflow_run for a tag push, so no PR ever schedules Windows or
  # macOS minutes. That guard is belt-and-braces, not the primary reason: this
  # workflow has no `pull_request` trigger at all, so no PR reaches this file.
  acceptance:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.conclusion == 'success')
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          # On a release workflow_run, check out the exact commit the release
          # built from; on dispatch, fall back to the dispatched ref.
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      # ── 1a. After a release: download the REAL artifact for this OS ─────────
      # The release archive carries the binary + the bundled dashboard, so this
      # tests exactly what ships. Falls through to a local build on dispatch.
      - name: Resolve artifact arch label
        id: arch
        shell: bash
        run: |
          case "${{ matrix.os }}" in
            ubuntu-latest)  echo "os=linux"   >> "$GITHUB_OUTPUT"; echo "arch=x86_64" >> "$GITHUB_OUTPUT"; echo "ext=tar.gz" >> "$GITHUB_OUTPUT" ;;
            macos-14)       echo "os=macos"   >> "$GITHUB_OUTPUT"; echo "arch=arm64"  >> "$GITHUB_OUTPUT"; echo "ext=tar.gz" >> "$GITHUB_OUTPUT" ;;
            windows-latest) echo "os=windows" >> "$GITHUB_OUTPUT"; echo "arch=x86_64" >> "$GITHUB_OUTPUT"; echo "ext=zip"    >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Download released archive (after release publishes)
        if: github.event_name == 'workflow_run'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          NAME="grafel_${VERSION}_${{ steps.arch.outputs.os }}_${{ steps.arch.outputs.arch }}.${{ steps.arch.outputs.ext }}"
          mkdir -p artifact
          echo "Fetching release asset $NAME for tag ${TAG}"
          # The `release` workflow has COMPLETED (this runs via workflow_run), so
          # the assets are already published; a short retry only covers GitHub's
          # brief asset-availability lag after a release is finalized.
          for i in 1 2 3 4 5 6; do
            if gh release download "${TAG}" --repo "${GITHUB_REPOSITORY}" \
                 --pattern "$NAME" --dir artifact 2>/dev/null; then
              echo "downloaded $NAME"; break
            fi
            echo "asset not ready yet (attempt $i); sleeping 20s"; sleep 20
          done
          test -f "artifact/$NAME" || { echo "FAIL: release asset $NAME not found for tag ${TAG}"; exit 1; }
          # Same MSYS→pwsh handoff as the dispatch build step: this bash step is
          # MSYS on Windows so $PWD is /d/a/...; the pwsh "Install (windows)" step
          # needs a native D:\a\... path. Convert on Windows, leave unix as-is.
          ARCHIVE_PATH="$PWD/artifact/$NAME"
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            ARCHIVE_PATH="$(cygpath -w "$ARCHIVE_PATH")"
          fi
          echo "ARCHIVE=${ARCHIVE_PATH}" >> "$GITHUB_ENV"

      # ── 1b. On manual dispatch (no release): build the binary locally ───────
      # Build the dashboard SPA first so the embed is the real UI (mirrors
      # release.yml), then `go build -tags osusergo` with CGO (tree-sitter).
      - name: Setup Node (local build)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: webui-v2/package-lock.json

      - name: Build dashboard SPA (local build)
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          (cd webui-v2 && npm ci && npx vite build)
          rm -rf internal/dashboard/dist
          cp -r webui-v2/dist internal/dashboard/dist

      - name: Setup MSYS2 + MinGW (Windows local build)
        if: github.event_name == 'workflow_dispatch' && matrix.os == 'windows-latest'
        # NOT bumped by the #7243 Node20 -> Node24 action migration, and not an
        # oversight: msys2/setup-msys2 already declares `runs.using: node24` at
        # both `v2` and `v2.31.1` (checked against the action.yml at each tag),
        # so it never emitted the forced-migration warning. There is no v3.
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-make
          update: false

      - name: Enable CGO on Windows (local build)
        if: github.event_name == 'workflow_dispatch' && matrix.os == 'windows-latest'
        shell: bash
        run: |
          echo "CGO_ENABLED=1" >> "$GITHUB_ENV"
          echo "CC=x86_64-w64-mingw32-gcc" >> "$GITHUB_ENV"

      - uses: actions/setup-go@v6
        if: github.event_name == 'workflow_dispatch'
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Cache Go build + module cache (local build)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-acceptance-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-acceptance-go-

      - name: Build grafel + package archive (local build)
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          CGO_ENABLED: '1'
        run: |
          set -euo pipefail
          BIN=grafel
          [ "${{ matrix.os }}" = "windows-latest" ] && BIN=grafel.exe
          EXTRA=""
          [ "${{ matrix.os }}" = "windows-latest" ] && EXTRA="-extldflags=-static"
          mkdir -p dist artifact
          go build -trimpath -tags osusergo \
            -ldflags "-s -w ${EXTRA}" \
            -o "dist/${BIN}" ./cmd/grafel
          cp LICENSE README.md dist/
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            NAME="grafel_dispatch_${{ steps.arch.outputs.os }}_${{ steps.arch.outputs.arch }}.zip"
            (cd dist && 7z a -tzip "../artifact/${NAME}" grafel.exe LICENSE README.md)
          else
            NAME="grafel_dispatch_${{ steps.arch.outputs.os }}_${{ steps.arch.outputs.arch }}.tar.gz"
            (cd dist && tar czf "../artifact/${NAME}" grafel LICENSE README.md)
          fi
          # This bash step runs under MSYS on the Windows runner, so $PWD is a
          # POSIX path (/d/a/grafel/grafel). The "Install (windows)" step that
          # consumes ARCHIVE runs in pwsh, which cannot resolve a /d/a/... path
          # (Expand-Archive fails). Convert to a native Windows path (D:\a\...)
          # via cygpath on Windows; leave unix paths untouched.
          ARCHIVE_PATH="$PWD/artifact/${NAME}"
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            ARCHIVE_PATH="$(cygpath -w "$ARCHIVE_PATH")"
          fi
          echo "ARCHIVE=${ARCHIVE_PATH}" >> "$GITHUB_ENV"

      # ── 2. Install the artifact the way a user does (unix) ──────────────────
      # Extract into the real install prefix ($HOME/.grafel/bin) and add it to
      # PATH via $GITHUB_PATH — the same prefix + PATH wiring install.sh uses.
      # We extract the local archive directly (the shell installer's *download*
      # step targets a published release that doesn't exist on a pre-release).
      - name: Install (unix)
        if: matrix.os != 'windows-latest'
        shell: bash
        run: |
          set -euo pipefail
          PREFIX="$HOME/.grafel"
          BIN_DIR="$PREFIX/bin"
          mkdir -p "$BIN_DIR" "$PREFIX/extract"
          tar -xzf "$ARCHIVE" -C "$PREFIX/extract"
          install -m 0755 "$PREFIX/extract/grafel" "$BIN_DIR/grafel"
          echo "$BIN_DIR" >> "$GITHUB_PATH"
          echo "GRAFEL_PREFIX=$PREFIX" >> "$GITHUB_ENV"

      - name: Install (windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # grafel resolves its home as $HOME (if set) else %USERPROFILE% — see
          # internal/install/state.go userHomeDir(). The catch on the Windows
          # runner is that actions/checkout@v5 logs "Temporarily overriding
          # HOME='D:\a\_temp\...'" and that override LEAKS INCONSISTENTLY across
          # job steps: HOME is set in some steps and unset in others. If install
          # resolves home via a transient HOME but integrity/uninstall resolve it
          # via USERPROFILE (HOME unset there), they look under different .grafel
          # prefixes and the gate fails (run 27642393411). Pin HOME=USERPROFILE at
          # the TOP of EVERY grafel step so the binary's $HOME-first precedence
          # always resolves to the SAME stable prefix, immune to checkout's
          # override. An in-step assignment is used (not job-level `env: HOME`)
          # because checkout overrides a job-level HOME at runtime, whereas this
          # per-step assignment runs after checkout and is the last writer.
          $env:HOME = $env:USERPROFILE
          $GrafelHome = $env:HOME
          $Prefix = Join-Path $GrafelHome '.grafel'
          $BinDir = Join-Path $Prefix 'bin'
          $Extract = Join-Path $Prefix 'extract'
          New-Item -ItemType Directory -Force -Path $BinDir, $Extract | Out-Null
          Expand-Archive -Path $env:ARCHIVE -DestinationPath $Extract -Force
          $src = Get-ChildItem -Path $Extract -Recurse -Filter 'grafel.exe' | Select-Object -First 1
          if (-not $src) { throw "archive did not contain grafel.exe" }
          Copy-Item -Path $src.FullName -Destination (Join-Path $BinDir 'grafel.exe') -Force
          Add-Content -Path $env:GITHUB_PATH -Value $BinDir
          Add-Content -Path $env:GITHUB_ENV  -Value "GRAFEL_PREFIX=$Prefix"

      # ── 3. Post-install integrity ───────────────────────────────────────────
      - name: Integrity — binary on PATH + version (unix)
        if: matrix.os != 'windows-latest'
        shell: bash
        run: |
          set -euo pipefail
          command -v grafel
          grafel --version
          grafel doctor || echo "doctor returned non-zero (no service in headless CI) — tolerated"

      - name: Integrity — binary on PATH + version (windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # Pin HOME=USERPROFILE (see Install step) so this step's grafel
          # invocation resolves the same home as install — checkout's transient
          # HOME override leaks inconsistently across steps.
          $env:HOME = $env:USERPROFILE
          (Get-Command grafel).Source
          grafel --version
          grafel doctor
          if ($LASTEXITCODE -ne 0) { Write-Host "doctor non-zero (not yet installed / no service in headless CI) — tolerated"; $global:LASTEXITCODE = 0 }

      # MCP config + install.json via the real `grafel install --copy` path.
      # Service registration (launchd/systemd) is expected to warn in headless
      # CI; --copy still writes install.json + MCP, which is what we assert.
      - name: Integrity — MCP config + install.json (unix)
        if: matrix.os != 'windows-latest'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.claude"
          echo '{}' > "$HOME/.claude/.claude.json"
          LOG="${RUNNER_TEMP:-/tmp}/grafel-install.log"
          # A non-zero exit here is tolerated ONLY because headless CI has no
          # service manager to register the daemon with. It is NOT proof that
          # the failure was benign — the previous version of this step printed
          # "service step warned … tolerated" unconditionally, which asserted a
          # diagnosis it had not made. `grafel install` aborted at step 4 on all
          # three OS legs for five consecutive runs (#6070) and this line
          # labelled it a service warning every time, so the red was read as
          # "acceptance is just broken" for two weeks while a shipped install
          # failure hid behind it. Capture the real exit code and output, and
          # let the assertions below decide.
          set +e
          grafel install --copy \
            --skills-source-dir ./skills \
            --claude-config-dirs "$HOME/.claude/.claude.json" \
            --force 2>&1 | tee "$LOG"
          rc=${PIPESTATUS[0]}
          set -e
          if [ "$rc" -ne 0 ]; then
            echo "::warning::grafel install exited $rc — tolerated only if the integrity assertions below pass"
          fi
          fail() {
            echo "FAIL: $1"
            echo "grafel install exit code: $rc"
            echo "── grafel install output ──────────────────────────────────"
            cat "$LOG"
            echo "───────────────────────────────────────────────────────────"
            exit 1
          }
          test -d "$HOME/.grafel" || fail "~/.grafel not created"
          test -f "$HOME/.grafel/install.json" || fail "install.json not written"
          grep -q grafel "$HOME/.claude/.claude.json" || fail "MCP not registered in .claude.json"
          echo "integrity OK: ~/.grafel + install.json + MCP config present"

      - name: Integrity — MCP config + install.json (windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # Pin HOME=USERPROFILE (see Install step) so grafel's $HOME-first home
          # resolution lands on the SAME .grafel prefix the install used.
          # checkout's transient HOME override leaks inconsistently across steps,
          # so we make HOME deterministic here rather than branch on it.
          $env:HOME = $env:USERPROFILE
          $GrafelHome = $env:HOME
          $claudeDir = Join-Path $env:USERPROFILE '.claude'
          New-Item -ItemType Directory -Force -Path $claudeDir | Out-Null
          $claudeCfg = Join-Path $claudeDir '.claude.json'
          '{}' | Set-Content -Path $claudeCfg
          # See the unix leg for why the tolerated-failure message must not
          # assert a diagnosis: this printed "service step warned … tolerated"
          # while `grafel install` was in fact aborting at step 4 (#6070), which
          # is how a shipped install failure stayed invisible for two weeks.
          # Keep the output so a failure below is self-diagnosing.
          $installLog = ''
          $rc = 0
          try {
            $installLog = (grafel install --copy --skills-source-dir ./skills --claude-config-dirs $claudeCfg --force 2>&1 | Out-String)
            $rc = $LASTEXITCODE
          } catch {
            $installLog = "$_"
            $rc = 1
          }
          Write-Host $installLog
          if ($rc -ne 0) { Write-Host "::warning::grafel install exited $rc — tolerated only if the integrity assertions below pass" }
          $global:LASTEXITCODE = 0
          function Fail-Integrity($msg) {
            Write-Host "grafel install exit code: $rc"
            Write-Host "── grafel install output ──────────────────────────────────"
            Write-Host $installLog
            Write-Host "───────────────────────────────────────────────────────────"
            throw $msg
          }
          $prefix = Join-Path $GrafelHome '.grafel'
          if (-not (Test-Path $prefix)) { Fail-Integrity "~/.grafel not created" }
          if (-not (Test-Path (Join-Path $prefix 'install.json'))) { Fail-Integrity "install.json not written" }
          if (-not (Select-String -Path $claudeCfg -Pattern 'grafel' -Quiet)) { Fail-Integrity "MCP not registered in .claude.json" }
          Write-Host "integrity OK: ~/.grafel + install.json + MCP config present"

      # ── 4. THE HEART: grafel selftest (functional acceptance ladder) ────────
      # Fully isolated (own temp GRAFEL_DAEMON_ROOT + dynamic dashboard port);
      # needs no service manager, so it is the authoritative functional check on
      # the HEADLESS macOS runner too (real launchd validation = #5229 runbook).
      - name: grafel selftest (acceptance ladder) (unix)
        if: matrix.os != 'windows-latest'
        run: grafel selftest

      - name: grafel selftest (acceptance ladder) (windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        env:
          GRAFEL_SELFTEST_READY_TIMEOUT_SEC: 120
        run: |
          $ErrorActionPreference = 'Stop'
          # selftest is self-isolated (own temp GRAFEL_DAEMON_ROOT), but keep HOME
          # pinned identically to the other Windows steps so home resolution is
          # uniform across the whole job and never depends on checkout's transient
          # HOME override.
          $env:HOME = $env:USERPROFILE
          grafel selftest

      # ── 5. Uninstall → assert CLEAN teardown ────────────────────────────────
      - name: Uninstall + assert clean (unix)
        if: matrix.os != 'windows-latest'
        shell: bash
        run: |
          set -euo pipefail
          grafel uninstall --yes --purge --remove-binary \
            --claude-config-dirs "$HOME/.claude/.claude.json" || echo "uninstall: service step warned — tolerated"
          fail=0
          if [ -f "$HOME/.grafel/install.json" ]; then echo "FAIL: install.json still present"; fail=1; fi
          if grep -q grafel "$HOME/.claude/.claude.json"; then echo "FAIL: MCP entry still present"; fail=1; fi
          if [ -x "$HOME/.grafel/bin/grafel" ]; then echo "FAIL: binary still present after --remove-binary"; fail=1; fi
          [ "$fail" -eq 0 ] && echo "teardown CLEAN: no install.json, no MCP entry, no binary"
          exit $fail

      - name: Uninstall + assert clean (windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          # Pin HOME=USERPROFILE (see Install step) so teardown asserts against the
          # SAME .grafel prefix the install used — checkout's transient HOME
          # override leaks inconsistently across steps, so we make HOME
          # deterministic here rather than branch on it.
          $env:HOME = $env:USERPROFILE
          $GrafelHome = $env:HOME
          $claudeCfg = Join-Path (Join-Path $env:USERPROFILE '.claude') '.claude.json'
          $prefix = Join-Path $GrafelHome '.grafel'
          try {
            grafel uninstall --yes --purge --remove-binary --claude-config-dirs $claudeCfg
          } catch { Write-Host "uninstall: service step warned — tolerated" }
          $fail = $false
          if (Test-Path (Join-Path $prefix 'install.json')) { Write-Host "FAIL: install.json still present"; $fail = $true }
          if (Select-String -Path $claudeCfg -Pattern 'grafel' -Quiet) { Write-Host "FAIL: MCP entry still present"; $fail = $true }
          if (Test-Path (Join-Path (Join-Path $prefix 'bin') 'grafel.exe')) { Write-Host "FAIL: binary still present after --remove-binary"; $fail = $true }
          if ($fail) { exit 1 }
          Write-Host "teardown CLEAN: no install.json, no MCP entry, no binary"
