name: quality

on:
  # Dispatch-only, in line with every other workflow in this repo (free-tier
  # minute budget — see .github/workflows/test.yml). This is NOT a per-PR gate;
  # run `scripts/quality/run.sh --runs 1 --ratchet` locally instead.
  workflow_dispatch:
    inputs:
      mode:
        description: 'Gate: ratchet (hold recorded baseline) or strict (demand 100% recall)'
        type: choice
        default: ratchet
        options: [ratchet, strict]

permissions:
  contents: read

jobs:
  quality:
    name: Extraction-quality gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true
      - run: go mod download
      - name: Build grafel
        run: go build -o build/grafel ./cmd/grafel
      # Refs #6231: the strict 100%-must-have-recall gate has not been green
      # across the full fixture set since it grew past the original five, so
      # running it here would mean a permanently red workflow that nobody reads.
      # We run the ratchet instead: hold the per-fixture floor recorded in
      # internal/quality/golden/baseline.json. Set mode=strict on dispatch to
      # see the full outstanding gap.
      - name: Run extraction-quality fixtures (ratchet)
        run: scripts/verify2/run-quality.sh
        env:
          GRAFEL_BIN: ${{ github.workspace }}/build/grafel
          QUALITY_OUT_DIR: ${{ github.workspace }}/reports/quality
          QUALITY_MODE: ${{ inputs.mode }}
      - name: Upload quality reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-reports
          path: reports/quality/*.json
          if-no-files-found: warn
