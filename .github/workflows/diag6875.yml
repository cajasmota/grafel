# THROWAWAY diagnostic workflow for #6875. Delete with the branch.
# test.yml does not run on `push`, so this branch gets its own runner.
#
# Round 3. Rounds 1-2 established:
#   - Defender real-time + WSearch are OFF on windows-latest, and a 1-writer
#     control never gets denied => no external handle.
#   - 8-way self-contention denies ~45% of renames, but only ever needed <=5
#     attempts against a 41 budget.
#   - CPU saturation makes the test 100x SLOWER but LESS collision-prone.
# Neither round reproduced the failure -- but the CI failure rate is roughly
# 1 in 20,000 writes and rounds 1-2 sampled only ~3,800. This round samples
# ~200,000 writes so the heavy tail can actually show up, and probes the
# holder live at the moment any rename crosses the production budget.
name: diag6875

on:
  push:
    branches: ['lane/6875-**']

permissions:
  contents: read

jobs:
  diag:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      # ~200 x 960 writes. Any rename crossing 41 attempts triggers a live
      # Restart Manager + os.Stat probe of the destination from inside the
      # retry loop, while the other writers are still running.
      - name: High-sample contention profile (IDLE)
        shell: pwsh
        env:
          GRAFEL_DIAG_6875: '1'
        run: |
          go test ./internal/atomicfile/ -run TestDiag6875_RenameContentionProfile -count=200 -v -timeout 45m 2>&1 | Tee-Object -FilePath profile-high.txt
          Write-Host "=== renames that EXCEEDED the production budget ==="
          Select-String -Path profile-high.txt -Pattern 'EXCEEDED the production budget of 41: [1-9]' | ForEach-Object { $_.Line }
          Write-Host "=== live holder probes ==="
          Select-String -Path profile-high.txt -Pattern 'LIVE PROBE|RestartManager|os.Stat\(dest\)' | ForEach-Object { $_.Line }
          Write-Host "=== worst max-attempts seen ==="
          Select-String -Path profile-high.txt -Pattern 'writes=320' | ForEach-Object { $_.Line } | Sort-Object -Unique
          exit 0

      # The unmodified production test, real 41-attempt budget, high count.
      # ~400 x 320 = 128,000 writes. At the observed CI rate this should fail
      # a handful of times if the CI failures are this test's own contention.
      - name: Production test failure rate at high count
        shell: pwsh
        run: |
          go test ./internal/atomicfile/ -run TestWriteFile_ConcurrentWritersSameDestination -count=400 -v -timeout 45m 2>&1 | Tee-Object -FilePath prod-high.txt
          Write-Host "=== tally ==="
          Write-Host ("PASS: " + (Select-String -Path prod-high.txt -Pattern '--- PASS: TestWriteFile_Concurrent').Count)
          Write-Host ("FAIL: " + (Select-String -Path prod-high.txt -Pattern '--- FAIL: TestWriteFile_Concurrent').Count)
          Select-String -Path prod-high.txt -Pattern 'still failing after' | ForEach-Object { $_.Line }
          exit 0

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diag6875-logs-round3
          path: |
            profile-high.txt
            prod-high.txt
