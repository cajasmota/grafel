# THROWAWAY diagnostic workflow for #6875. Delete with the branch.
# test.yml does not run on `push`, so this branch gets its own runner.
name: diag6875

on:
  push:
    branches: ['lane/6875-**']

permissions:
  contents: read

jobs:
  diag:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Runner environment
        shell: pwsh
        run: |
          Write-Host "cores=$env:NUMBER_OF_PROCESSORS"
          Write-Host "TEMP=$env:TEMP"
          Write-Host "--- Defender ---"
          try {
            Get-MpComputerStatus | Select-Object RealTimeProtectionEnabled,AntivirusEnabled,OnAccessProtectionEnabled,IsTamperProtected | Format-List
            Get-MpPreference | Select-Object DisableRealtimeMonitoring,ExclusionPath | Format-List
          } catch { Write-Host "Defender query failed: $_" }
          Write-Host "--- Search indexer (WSearch) ---"
          try { Get-Service WSearch | Format-List Name,Status,StartType } catch { Write-Host "WSearch query failed: $_" }
          Write-Host "--- admin? ---"
          Write-Host ([Security.Principal.WindowsPrincipal][Security.Principal.WindowsIdentity]::GetCurrent()).IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)

      # Experiment 1 — attempts-to-success distribution + live holder probe,
      # arm A (8 concurrent writers) vs arm B (1 writer, same exposure).
      - name: Contention profile
        shell: pwsh
        env:
          GRAFEL_DIAG_6875: '1'
        run: |
          go test ./internal/atomicfile/ -run TestDiag6875_RenameContentionProfile -count=3 -v -timeout 30m 2>&1 | Tee-Object -FilePath profile.txt
          exit 0

      # Experiment 2 — the natural failure rate of the UNMODIFIED production
      # test under the real 41-attempt budget. Never fails the job; the count
      # of FAIL lines is the measurement.
      - name: Production test failure rate (unmodified)
        shell: pwsh
        run: |
          go test ./internal/atomicfile/ -run TestWriteFile_ConcurrentWritersSameDestination -count=25 -v -timeout 30m 2>&1 | Tee-Object -FilePath prod.txt
          Write-Host "=== FAIL lines ==="
          Select-String -Path prod.txt -Pattern 'still failing after|--- FAIL' | ForEach-Object { $_.Line }
          exit 0

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diag6875-logs
          path: |
            profile.txt
            prod.txt
