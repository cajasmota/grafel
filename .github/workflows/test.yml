name: test

# Free-tier minute budget: macOS bills 10x, Windows 2x. The "~195 billed min"
# figure this comment used to quote was measured WITHOUT -race and no longer
# describes the tag/dispatch path: -race costs roughly 5-10x wall time, and it
# is now on by default for both (see the Race detector policy step below).
# Locally the -race suite is ~30 min of package wall time vs ~5 min without, so
# treat a tag run as multiples of 195 billed min, not 195. NOT re-measured on
# GitHub runners — do that before relying on any number here (#6056).
# Refs #6291: every PR used to be fully green while every test in the repo
# failed. This workflow only ran on a version tag or a manual dispatch, so 24
# merges landed between v0.2.1 and fb4c6fd4b without the suite running once —
# and when it was finally dispatched by hand, main was red on Linux AND
# Windows with five distinct defects, two user-affecting (an FD-ledger
# over-count on Linux; a home-containment guard that failed open on Windows).
# One Windows test hung 40 minutes under -race and then panicked, blanking
# every test after it in its package. cross-platform-compile.yml (always-on)
# is compile-only — go vet/go build never execute a single test body — so it
# could not and did not catch any of this; see #6219.
#
# PER-PR AUTO GATE (this is the fix): `pull_request` now runs Ubuntu +
# Windows automatically, WITHOUT -race, `go test -timeout 15m` per package.
#   - Ubuntu: fast, and is exactly what would have caught the FD-ledger defect.
#   - Windows: slow (~45m under the full -race matrix) but is where the two
#     worst, user-affecting defects hid, including the 40-minute hang — so it
#     stays IN the automatic PR gate rather than being pushed behind a label.
#   - macOS is deliberately EXCLUDED from the automatic PR leg: it was the one
#     platform that came back green when the suite was finally dispatched, and
#     it is the platform contributors here already verify locally before
#     opening a PR — the least informative of the three on a PR, and the most
#     expensive to run automatically (10x billing). It is still covered by the
#     tag gate, workflow_dispatch, and the `ci:full` label below.
#   - No -race on the automatic PR leg: none of the three `if:` branches on
#     the Test step match a plain `pull_request` event, so it falls through to
#     the `-timeout 15m` no-race branch that already existed for
#     workflow_dispatch with race=false. -race adds 5-10x wall time, which
#     would make the auto-PR gate the same order of magnitude as the 45-minute
#     full matrix — unusable as a per-PR gate. Concurrency defects are instead
#     caught by the -race legs below (tag, dispatch, `ci:full` label), not by
#     the default PR run.
#   - Hang behavior: `go test -timeout` panics the whole binary when it fires,
#     which blanks every not-yet-finished test in that package — that is what
#     turned the 40-minute race-branch hang into "no result for 200 tests".
#     15m (not 40m) bounds how long a hung PR run stays silent before it does
#     that; it is a strictly tighter bound than the incident, not a cure for
#     the panic-blanks-package mechanism itself, which is inherent to `go
#     test -timeout` and unrelated to this change.
# Milestone gate: full 3-platform -race matrix runs on version tags + manual
#   workflow_dispatch (race=true by default).
#   → batch the platform checks before shipping a milestone.
# Opt-in: add label `ci:full` to force the full 3-platform -race matrix
#   (including macOS) on a specific PR — unchanged by this commit.
# Race detector: ON for tag runs and (by default) workflow_dispatch, and for
#   `ci:full`-labelled PRs — see the "Race detector policy" comment on the
#   Test step for exactly what each trigger delivers. There is deliberately NO
#   push-to-main trigger; the comment used to claim post-merge race sanity on
#   main that the triggers never provided (#6056).
#
# ON A TAG, THIS WORKFLOW IS CALLED BY release.yml — IT IS NOT TRIGGERED DIRECTLY.
# It used to subscribe to `push: tags ['v*']`, the same trigger as release.yml,
# so the two started CONCURRENTLY and neither could fail the other: a red matrix
# did not stop a publish (#6064). The tag trigger is gone and release.yml now
# invokes this workflow through `workflow_call` and hangs its publish job off it
# with `needs:`, which is a real dependency. Same matrix, same -race, same
# platforms, on every tag as before — the only change is that it now BLOCKS.
# Do not re-add `push: tags` here: it would restore the parallel run this file
# spent #6056 documenting and #6064 removing, and would double every tag run.

on:
  # Invoked by release.yml on a version tag. The `race` input is declared for
  # both entry points so the `${{ inputs.race }}` expression on the Test step
  # resolves under either; on the tag path the first branch of that condition
  # already matches, so -race is on regardless of what is passed.
  workflow_call:
    inputs:
      race:
        description: 'Run the suite under the Go race detector (-race).'
        type: boolean
        default: true

  workflow_dispatch:
    inputs:
      race:
        description: 'Run the suite under the Go race detector (-race). ON by default so a pre-release dispatch matches the tag run exactly; turn it off for a quick platform-only check.'
        type: boolean
        default: true

  pull_request_target:
    types: [labeled]

  # Refs #6291. Plain `pull_request` (not `pull_request_target`): this runs
  # with the default read-only GITHUB_TOKEN (see `permissions:` below) and
  # GitHub already checks out the PR's HEAD for this event by default, so it
  # needs none of the elevated-permission caveats the `pull_request_target`
  # trigger above carries — see the SECURITY NOTE on the checkout step. No
  # `types:` filter: runs on open, sync (new pushes) and reopen, i.e. every PR
  # update, which is the point (#6291 — 24 merges landed with the suite never
  # running once).
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # Gate: run when —
    #   (a) workflow_dispatch, OR
    #   (b) a `push` — which now only reaches this job via release.yml's
    #       `workflow_call` on a `v*` tag. A called workflow sees the CALLER's
    #       event, so `github.event_name` is `push` and `github.ref` is
    #       `refs/tags/v*`, exactly as when this workflow subscribed to the tag
    #       itself. That is what keeps both this gate and the -race branch below
    #       working unchanged, OR
    #   (c) pull_request_target with the `ci:full` label, OR
    #   (d) plain pull_request (#6291).
    #
    # UNCHANGED by this commit: (a)-(c) are the same sub-expressions, so the
    # tag and workflow_dispatch paths are byte-identical in effect — the OR
    # with (d) can only make the whole condition MORE true for OTHER event
    # types, and a plain `pull_request` event can never simultaneously be
    # `push`, `workflow_dispatch` or `pull_request_target`, so (a)-(c) are
    # unaffected by the addition.
    #
    # NOTE: `matrix.*` is deliberately NOT referenced here. GitHub Actions
    # only exposes the `matrix` context to `jobs.<job_id>.strategy` and
    # `jobs.<job_id>.steps.<step_id>.if` — NOT to the job-level `if:` (a
    # job-level `if:` is evaluated once, before the matrix is expanded, so
    # `matrix` isn't defined yet at that point). The macOS-on-PR exclusion
    # therefore lives in the `strategy.matrix.os` expression below, not here.
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push' ||
      (github.event_name == 'pull_request_target' && contains(github.event.pull_request.labels.*.name, 'ci:full')) ||
      github.event_name == 'pull_request'

    # Bound the whole matrix leg. GitHub's default is 6 HOURS, billed at 10x on
    # macOS — so a genuine deadlock, which is exactly what -race exists to
    # surface, used to be the most expensive possible outcome. 90m is well above
    # the observed -race wall time (see the Test step's timing notes) and well
    # below the default. Distinct from `go test -timeout`, which is per test
    # binary and only fires if a binary hangs; this one also catches a hang in
    # any other step (module download, MSYS2 setup, the build).
    timeout-minutes: 90

    strategy:
      fail-fast: false
      # Refs #6291. `github` (unlike `matrix`) IS available to
      # `jobs.<job_id>.strategy`, so the OS list itself can be conditioned on
      # the triggering event: the automatic `pull_request` path gets
      # ubuntu-latest + windows-latest only; every other trigger
      # (workflow_dispatch, tag push via workflow_call, and a
      # `ci:full`-labelled pull_request_target) gets the full three-OS list,
      # unchanged from before this commit. macOS is the leg excluded from the
      # automatic PR run — see the header comment: it was the one platform
      # that came back green when the suite was finally dispatched at
      # fb4c6fd4b, it's the platform contributors here already verify
      # locally, and it's the most expensive of the three to bill
      # automatically on every PR (10x).
      matrix:
        os: ${{ github.event_name == 'pull_request' && fromJSON('["ubuntu-latest","windows-latest"]') || fromJSON('["ubuntu-latest","macos-latest","windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      # SECURITY NOTE: pull_request_target runs with write permissions but defaults
      # to checking out the BASE branch (main), not the PR's HEAD. This means CI
      # would test main's code, not the PR's changes — a silent correctness failure.
      # We explicitly ref the PR HEAD here. This is safe because the workflow is
      # gated by the `ci:full` label (see the `pull_request_target:` trigger
      # above), which only collaborators with write access can apply — making
      # this functionally equivalent to pull_request.
      # The `|| github.sha` fallback handles workflow_dispatch, tag pushes, and the
      # plain `pull_request` trigger (#6291) — which GitHub already checks out at
      # HEAD by default, so the explicit ref there is redundant but harmless, and
      # keeps this one checkout step correct for every trigger this workflow has.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      # MinGW is required on Windows for CGO (tree-sitter bindings).
      # Resolves #937 / #1796 — no vendor patch needed with CGO_ENABLED=1.
      - name: Setup MSYS2 + MinGW (Windows only)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2.31.1
        with:
          msystem: MINGW64
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-make
          update: false

      - name: Enable CGO on Windows
        if: runner.os == 'Windows'
        shell: bash
        run: |
          echo "CGO_ENABLED=1" >> $GITHUB_ENV
          echo "CC=x86_64-w64-mingw32-gcc" >> $GITHUB_ENV

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - run: go mod download

      - run: go vet ./...

      # Compile-guard for the `perf` build tag (see CONTRIBUTING.md,
      # "Performance tests"). Performance/scaling tests are excluded from this
      # suite by the tag, so nothing else here would notice them failing to
      # compile — an undefined symbol in a tagged file passes plain `go vet` and
      # only fails with the tag set. Gated tests that rot are worse than the
      # flakes they replaced, and this is the release gate, so it is checked
      # here rather than left to the weekly `perf` workflow.
      # Linux only: it is a compile check, not a platform check.
      - name: go vet (perf-tagged tests still compile)
        if: runner.os == 'Linux'
        run: go vet -tags perf ./...

      # Guard against the locale-bug class (#5317): control flow that matches a
      # localized OS command output / error string (e.g.
      # strings.Contains(out, "cannot find")) breaks on non-English locales.
      # Run on Linux only — it is a static AST check, platform-independent.
      - name: lint-localematch (locale-invariant command checks)
        if: runner.os == 'Linux'
        run: go run ./cmd/lint-localematch

      # gofmt check — only enforce on Linux to avoid CRLF noise from Windows
      # tooling. macOS and Linux share the same line endings in the repo so
      # running on ubuntu-latest is sufficient.
      - name: gofmt
        if: runner.os == 'Linux'
        shell: bash
        run: |
          diff=$(gofmt -l $(git ls-files '*.go') 2>&1)
          if [ -n "$diff" ]; then
            echo "Files need gofmt:"
            echo "$diff"
            exit 1
          fi

      # Coverage-registry cite check (#6352). `go run ./tools/coverage validate`
      # confirms every `cites` path in docs/coverage/registry.json still exists.
      # It used to live ONLY in coverage-docs.yml, which is path-filtered to
      # docs/coverage/**, tools/coverage/** and internal/extractors/**. But the
      # 23,450 cites span 22 top-level directories: only internal/extractors
      # (14.7%) is behind a filter path, so 18,007 cites — 76.8%, including all
      # of internal/substrate, internal/custom, internal/links and
      # internal/engine — sat behind paths that triggered no run. Deleting or
      # renaming a cited file under any of those merged green, and the breakage
      # then surfaced as an unrelated red on whoever next touched
      # docs/coverage/ (the #6332 failure shape, at four times the scale).
      #
      # A longer path list was rejected in #6352: 22 directories is an
      # approximation of "the whole repo" that rots silently — #6351 deleted
      # three dead entries and #6330 deleted 31 dead files from exactly this
      # kind of hand-maintained list. Running it here instead makes the
      # guarantee unconditional, because this workflow has NO path filter on
      # `pull_request` (#6291), so it fires on the change that breaks it.
      #
      # It is cheap: measured at 11.2s on run 32282703633, and nearly all of
      # that is the one-off `go run` compile plus printing ~10k pre-existing
      # advisory warnings — the scan itself is sub-second. That is why #6352's
      # "if validate costs seconds, the simpler option wins" clause applies.
      #
      # Linux only: it is a JSON scan plus file-existence stats, so it is
      # platform-independent — same rationale as the gofmt/vet steps above.
      - name: Validate coverage registry schema + cites (#6352)
        if: runner.os == 'Linux'
        run: go run ./tools/coverage validate

      - run: go build ./...

      # Purge BOTH the test-result cache AND the compiled-object cache.
      # actions/setup-go@v5 with cache:true persists ~/.cache/go-build across
      # runs, including compiled test binaries. -count=1 only disables result
      # caching; `go clean -testcache` flushes test results but NOT compiled
      # binaries; only `go clean -cache` flushes the build cache. Without
      # this combined clean, a stale compiled test binary from a previous PR
      # can run, masking the current PR's source changes (refs #2253).
      - run: go clean -cache -testcache

      # Normalize XDG_CONFIG_HOME on macOS so config resolution matches the
      # Linux/Windows runners (#5477). GitHub's ubuntu/windows runners export
      # XDG_CONFIG_HOME=$HOME/.config, which registry.ConfigDir honors first, so
      # an un-isolated config-writing test resolves a path UNDER $HOME and the
      # #5443 fail-closed write-guard panics — catching the leak. The macOS
      # runner leaves XDG_CONFIG_HOME unset, so config resolved elsewhere and the
      # same leak slipped past on macOS-only runs, surfacing only on the two
      # slower-billed OSes. Exporting it here makes all three runners resolve
      # config identically, so the leak-detector catches un-isolated tests on
      # every platform.
      - name: Normalize XDG_CONFIG_HOME (macOS parity with Linux/Windows)
        if: runner.os == 'macOS'
        shell: bash
        run: echo "XDG_CONFIG_HOME=$HOME/.config" >> "$GITHUB_ENV"

      # Non-privileged Windows regression guard (#5316).
      #
      # The blind spot: this windows-latest runner is PRIVILEGED (admin /
      # Developer Mode), so os.Symlink — step 1 of the skill-link fallback chain
      # — succeeds here. That means the junction codepath added by #5318 / #5641
      # (what actually lets a NON-admin user install) is never exercised on CI.
      # A regression that reintroduced an admin-only symlink requirement, or that
      # broke `mklink /J`, would pass green while breaking every real non-admin
      # Windows user — exactly the elevation class a user hit end-to-end.
      #
      # TestLinkSkillDir_NonPrivilegedFallback forces the symlink primitive to
      # fail with the "privilege not held" error a standard user gets, then
      # asserts the junction/copy fallback engages and the link resolves to the
      # source content. It is deterministic (no real privilege drop needed) and
      # goes RED if an admin-only operation is reintroduced on the link path.
      #
      # We run it explicitly (-run, -v) so a skip or accidental removal is loud,
      # rather than relying on it being silently absorbed by `go test ./...`.
      - name: Non-privileged link fallback (Windows admin-regression guard)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          out=$(go test -count=1 -v -run '^TestLinkSkillDir_NonPrivilegedFallback$' \
            ./internal/install/skilllink/ 2>&1)
          echo "$out"
          # The test is build-tagged //go:build windows, so it MUST actually run
          # here — a "no tests to run" / skipped result means the guard silently
          # stopped protecting us; treat that as a failure.
          if ! echo "$out" | grep -q 'PASS: TestLinkSkillDir_NonPrivilegedFallback'; then
            echo "::error::non-privileged link fallback guard did not run/pass (#5316)"
            exit 1
          fi

      # Race detector policy (#2406, rewired in #6056).
      #
      # Every condition below is reachable from this workflow's `on:` block —
      # that is the point of #6056. The previous version documented three
      # guarantees, two of which the triggers could never deliver: it gated on
      # `push && ref == refs/heads/main` (this workflow has no
      # `push: branches: [main]`, so a push to main never starts it) and on
      # `event_name == 'release'` (there is no `release:` trigger). A `v*` tag
      # push arrives as refs/tags/v*, so the release path ran WITHOUT -race and
      # only a `ci:full`-labelled PR ever turned the detector on. Do not add a
      # condition here without adding the matching trigger above.
      #
      # What the triggers actually deliver now:
      #   - `v*` tag, via release.yml's workflow_call → race, all three
      #     platforms. A called workflow reports the caller's event, so this
      #     arrives as event_name=push / ref=refs/tags/v*.
      #   - workflow_dispatch   → race when the `race` input is true (default).
      #   - PR with `ci:full`   → race (platform-sensitive opt-in).
      #   - anything else       → no race (there is nothing else today; the
      #     branch exists so adding a cheap trigger later stays cheap).
      #
      # A TAG RUN IS NOW A RELEASE GATE (#6064). This paragraph used to say the
      # opposite, and it was right at the time: release.yml was `on: push: tags:
      # ['v*']` and so was this workflow, the SAME trigger, with no `needs:`, no
      # `workflow_run` and no approval between them. They started concurrently
      # and neither could fail the other — release.yml published at ~14 min
      # while this workflow was still running, so a race tripped by the windows
      # leg at ~22 min landed on an already-shipped tag. On the tag path -race
      # was a POST-MORTEM.
      #
      # That is fixed. This workflow's own tag trigger is gone; release.yml
      # calls it via `workflow_call` and its publish job carries
      # `needs: [build, tests]`. A red matrix on ANY of the three platforms now
      # fails the `tests` job, which skips `release`, which means no GitHub
      # Release is created. The binaries still build (that job runs in parallel
      # and is not gated) — they simply are not published.
      #
      # This also retires the manual step that stood in for the gate: v0.2.1 was
      # protected by dispatching this workflow on `main` by hand BEFORE tagging.
      # That worked, but it was a human remembering, written down nowhere except
      # a §0 checkbox in docs/runbooks/release-signoff.md. Forgetting it was a
      # silent downgrade to no gate at all. The dispatch is now redundant, not
      # merely documented — which was the point.
      #
      # The `race` input and its `true` default still matter for the standalone
      # dispatch path (a pre-release rehearsal, or checking a platform without
      # cutting a tag).
      #
      # -timeout is PER TEST BINARY, and the two branches need different values.
      #
      # -race branch → 40m. Measured on an M-series laptop at -p 2:
      # internal/mcp 525s (610s in a second, independent measurement) and
      # internal/engine 349s. Against the old 15m/900s ceiling that is 58-68%
      # and 39% respectively — consumed BEFORE the two effects that only apply
      # on CI: default -p equals runner cores (4 on ubuntu/windows, i.e. MORE
      # concurrent packages than measured here), and the runners' CPUs are
      # slower than this laptop. This file's own history cites 4.3x contention
      # inflation. 15m would therefore have produced `panic: test timed out` in
      # internal/mcp on the very tag run this change enables — red, with no race
      # signal, indistinguishable from a real failure and strictly worse than no
      # signal at all. 40m (not 30m) so the value does not depend on any other
      # branch landing an internal/mcp speedup first.
      # Next-slowest under -race: cmd/grafel 134s, internal/graph 119s,
      # internal/membench 108s, internal/cli 44s, internal/daemon 34s; the
      # remaining ~230 packages < 30s.
      #
      # no-race branch → 15m, unchanged; nothing about the non-race path moved.
      #
      # Job-level timeout-minutes: 90 (above) bounds the whole matrix leg. A
      # genuine deadlock — precisely what -race exists to surface — otherwise
      # runs to GitHub's 6-hour default on a 10x-billed macOS runner.
      # (refs #1797 / #937 / #2196)
      - name: Test
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "push" && "${{ github.ref }}" == refs/tags/v* ]] || \
             [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.race }}" == "true" ]] || \
             [[ "${{ contains(github.event.pull_request.labels.*.name, 'ci:full') }}" == "true" ]]; then
            echo "Running with -race (tag push / dispatch with race=true / ci:full label)"
            go test -race -count=1 -timeout 40m ./...
          else
            echo "Running without -race"
            go test -count=1 -timeout 15m ./...
          fi

  # ---------------------------------------------------------------------------
  # Python unit tests for the quality ratchet (#6709).
  #
  # `scripts/quality/test_ratchet.py` is this repo's ONLY Python test file, and
  # until this job existed NO workflow ran ANY Python test — its 33 tests, which
  # guard `scripts/quality/ratchet.py` (the component that decides whether a
  # quality regression blocks a merge), ran only when a human typed the command
  # locally. #6570 / #6627 / #6633 all landed new tests for this file that were
  # then never re-run automatically.
  #
  # WHY IT LIVES IN test.yml: this workflow has a plain `pull_request:` trigger
  # (see the `on:` block above), so this job runs on every PR open/sync/reopen.
  # Do NOT move it to `pre-merge.yml` or `quality.yml` — BOTH are
  # `workflow_dispatch:`-only, so a job wired there would never fire on a PR,
  # reproducing the exact defect #6709 is about. As of this commit the
  # workflows with a real `pull_request` trigger are: board-hygiene.yml,
  # coverage-docs.yml, cross-platform-compile.yml, test.yml (this file) and
  # windows-installers.yml.
  #
  # SEPARATE JOB, ON PURPOSE: it deliberately does not sit under the `test`
  # job's matrix or its multi-branch `if:`. It is Go-free (no toolchain, no
  # module download, no build cache), single-platform, and finishes in ~20s
  # locally, so it must not inherit the Go suite's 90-minute leg or its
  # macOS/Windows fan-out. It carries its own `if:` that excludes only
  # `pull_request_target`, where GitHub checks out the BASE ref — running the
  # base branch's tests there would prove nothing about the PR.
  #
  # NO `paths:` FILTER, anywhere: not on this job and not on the workflow. A
  # path filter is how this class of gate dies quietly — #6332 is the same
  # shape one file over. The suite is ~20s on the cheapest runner, so there is
  # no wall-clock argument for one.
  #
  # GIT IDENTITY: the suite builds ~12 temporary git repositories, but it sets
  # `user.email`/`user.name` (and `commit.gpgsign=false`) per-repo itself
  # immediately after each `git init` — verified by running the full suite with
  # HOME pointed at an empty directory and both GIT_CONFIG_GLOBAL and
  # GIT_CONFIG_SYSTEM neutralised: 33 tests, OK. So this job deliberately does
  # NOT `git config` a committer identity; adding one here would be dead
  # configuration that hides the day the suite stops setting its own.
  python-quality-tests:
    name: python ratchet tests
    if: github.event_name != 'pull_request_target'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Python version
        run: python3 --version

      # Run from the repo root: the suite is addressed as the dotted path
      # `scripts.quality.test_ratchet`, which resolves via implicit namespace
      # packages (there is no `scripts/__init__.py` and none is needed), and
      # the tests locate `ratchet.py` relative to their own file.
      #
      # No `pytest`, no `pip install`: the suite is stdlib-only (`unittest`,
      # `subprocess`, `tempfile`, `json`, `importlib.util`), so the hosted
      # image's preinstalled python3 is the entire dependency set.
      #
      # `-v` so a run that collects ZERO tests is visible in the log rather
      # than reading as a pass. `python3 -m unittest` exits non-zero on both a
      # test failure and an import error, so either lands this job red.
      - name: Run ratchet unit tests
        run: python3 -m unittest -v scripts.quality.test_ratchet
