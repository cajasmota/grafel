name: node-type gate

# Closes #7065 — the always-on check that a tree-sitter matcher names a node
# type the grammar actually has.
#
# THE GAP THIS FILLS
# Every tree-sitter predicate in this repo is a string literal compared against
# a grammar node kind, and a literal naming a node the grammar does not have is
# a SILENT NO-OP. The guard stops guarding, the pass still runs, and every
# recall-shaped instrument we own reports success because something was
# produced. #7064 shipped `case "variant_type_parameter", "type_parameter":`
# against tree-sitter-scala — neither node exists — and the resulting wrong edge
# BOUND, with "26/26 bound" reported green. A reviewer dumping the CST found it;
# no test could have. The #7065 audit then found 42 more dead literals, one of
# them behaviour-visible (#7068).
#
# WHY A JOB AND NOT A TEST LEG
# The gate loads 793 packages with full type information. Measured at ~13 s
# warm, which is cheap for a job and much too slow to sit inside `go test ./...`
# on three platforms. The job is the whole-tree run; the package's own tests are
# the positive controls, and they are small enough to live in the suite.
#
# SCOPE: node-type literal resolution only. Red here is always a fact about this
# tree, never a flake, but it is NOT always the same fact. Exit 1 (the gate's own
# verdict) means one of:
#   1. a string literal in a node-type position names no node in ANY grammar its
#      package can receive, and no baseline row covers it;
#   2. a baseline row matches nothing any more — the literal was fixed (delete
#      the row) or the file/package was renamed (rewrite the row's path);
#   3. a package produced node-type literals but no grammar could be derived for
#      it and it has no entry in skipExemptions — an unreviewed blind spot; or
#   4. the scan read fewer sites than its floor, i.e. the gate is not looking at
#      the tree and its verdict means nothing.
# It does NOT exit 1 on an alias-form dead literal. Those are printed in full on
# every run and deliberately not enforced yet (see enforceAliasForms); the set of
# them is pinned by a test, so a NEW one turns the test leg red even though it
# leaves this job green.
# Exit 2 (the tool could not run) means one of: the packages failed to load; the
# loader-integrity guard fired (a package parsed but its type information is
# absent or incomplete); a grammar in the registry is not an official-adapter
# language; or baseline.txt does not parse. And the first step can fail on its
# own terms — a positive control regressing.
#
# That list is exhaustive as of this header, and it is written out because a
# header promising fewer shapes than the job can produce is what gets a gate
# muted the first time it produces one more. Do not add a step here that can fail
# for a reason not on this list without extending the list.
#
# IF THIS GOES RED on a literal you believe is fine: it is not "fine" unless a
# grammar the package receives really has that node. Check with a CST dump. The
# baseline is for literals somebody has decided not to fix yet, each with a
# written justification — not for silencing a new one.
#
# ── SECOND JOB: workflow-event-gate (Closes #7250) ───────────────────────────
# A SEPARATE job in this file, not a step in the one above. The `SCOPE` section
# above forbids adding a step that can fail for a reason not on its list, and
# that restriction is kept: the node-type-gate job's steps, exit codes and
# failure list are untouched. The two jobs fail independently and report as
# separate checks.
#
# WHY IT LIVES HERE. It is the same defect, one domain over. Up there, a string
# literal in a node-type position is compared against the set of node kinds a
# grammar has, and a literal outside that set is a SILENT NO-OP. Down there, a
# string literal in an `if:` guard is compared against `github.event_name`, and
# a literal naming an event the workflow does not subscribe to is a SILENT
# NO-OP in exactly the same way — the job simply never runs, and nothing says
# so. `acceptance.yml`'s `pr-linux` job has been unreachable since its
# `pull_request` trigger was removed; three stale-CI defects (#7244, #7247,
# #7250) were each found by a human who happened to read an `on:` block.
#
# WHY NOT ITS OWN WORKFLOW, AND WHY NOT INSIDE acceptance.yml. A gate that sits
# in the workflow it guards is inert whenever that workflow is disabled — which
# is precisely how 939a0b348 neutered one here. This file is ALWAYS ON
# (pull_request + push to main + dispatch), so the gate runs on every change
# regardless of what acceptance.yml is or is not doing. It is not its own
# workflow because the repo does not need a sixteenth one for a sub-second
# python check with no build step.
#
# ITS FAILURE LIST, exhaustive. `workflow-event-gate` exit 1 means one of:
#   1. an `if:` guard compares `github.event_name` to an event its workflow's
#      effective event set does not contain, with no allow-list row;
#   2. an allow-list row matches nothing while its workflow is still present —
#      the job it covered was renamed, fixed or deleted and the row must go;
#   3. the scan read fewer workflows or parsed fewer guards than its floors,
#      i.e. it is not looking at the tree and its verdict means nothing.
# Exit 2 means the gate could not run (the workflow directory is missing or a
# file could not be read). Its positive-controls step can fail on its own
# terms. Same rule as above: do not add a step to that job that can fail for a
# reason not on this list without extending the list.

on:
  # ALWAYS ON. A path filter would be wrong twice over: a grammar bump changes
  # go.mod and renames nodes in files this repo never touches, and the sink
  # fixpoint means a change to one helper can make literals elsewhere reachable.
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: node-type-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node-type-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          cache: true

      # The controls run FIRST and are not optional. A green gate whose controls
      # are broken is worth nothing: the failure mode of a scan-and-assert-
      # absence tool is to find nothing for the wrong reason. They assert that
      # the scala defect of #7064 is detected; that re-introducing #7068's
      # for_each_statement fails; that a stale baseline row fails; that a NEW
      # dead literal is not suppressed by the baseline; that a literal reached
      # through a converted constant is still folded; that a literal valid in
      # one of a multi-grammar package's grammars does NOT fire; that the
      # internal/custom lane is resolved rather than silently skipped; that both
      # alias shapes (a local and a parameter holding a node type) are seen;
      # and that a polymorphic string helper is NOT mistaken for one.
      #
      # The reporting path is graded here too, separately from detection. FIVE
      # times in this PR the ungraded part turned out to be the printer: a
      # Result field nobody prints is exactly as invisible as a surface nobody
      # scans, deleting the whole skipped-surface block once left the suite
      # green, and grading a per-row label turned out not to grade the counter
      # that aggregates those same rows. Both printers are now driven on
      # hand-built inputs, and every number derived from other printed numbers
      # is re-derived from the emitted text rather than matched as a string —
      # a wrong number prints a perfectly well-formed line.
      #
      # Two claims that could go stale are computed rather than asserted: the
      # engine exemption re-measures its own "15 false failures" from the tree,
      # and the alias-form finding set is pinned in both directions.
      - name: Positive controls
        run: go test -count=1 -v ./tools/node-type-gate/

      - name: node-type gate (whole tree)
        run: go run ./tools/node-type-gate -report

  # ── Closes #7250. See the SECOND JOB section in the header. ────────────────
  workflow-event-gate:
    name: workflow-event gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      # stdlib-only python, no pip install, no setup-python — the runner image's
      # preinstalled python3 is the entire dependency set, the same contract
      # test.yml's `python ratchet tests` leg already runs under.
      - name: python3 version
        run: python3 --version

      # The controls run FIRST and are not optional. This gate is a
      # scan-and-assert-absence tool, and that shape has five independent ways
      # to be a silent no-op: it reads nothing, it reads the wrong files, it
      # parses nothing out of them, it detects nothing, or it detects and fails
      # to fail. A count floor catches only the first. Each of the five is
      # driven by a control, the permissive direction is driven separately, and
      # every control asserts the EXIT CODE rather than the message text.
      #
      # Two controls are about the real tree rather than a synthetic one:
      # `pr-linux` is a LIVE positive that the gate must still detect with the
      # allow-list off, and the allow-list row covering it must still match. The
      # allow-list is the only thing between this gate and a red main, so what
      # is underneath it is asserted directly.
      - name: Positive controls
        run: python3 -m unittest -v scripts.ci.test_workflow_event_gate

      # --manifest pins the exact filename set and the exact guard count per
      # file. Without it the only population check is a floor, and a floor with
      # slack is a hole the size of the slack: the guards here are concentrated
      # in three files (11 + 6 + 6) with thirteen carrying none, so losing
      # test.yml entirely still cleared the old floor and printed a green line.
      # A control asserts this step passes the flag, because a manifest nobody
      # turns on is the same nothing as no manifest.
      - name: workflow-event gate (all workflows)
        run: python3 scripts/ci/workflow_event_gate.py --manifest
