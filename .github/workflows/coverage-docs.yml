name: coverage-docs
on:
  pull_request:
    paths:
      - 'docs/coverage/**'
      - 'tools/coverage/**'
      # The supported-language list is derived from internal/extractors/<lang>/
      # at run time (tools/coverage/languages.go SupportedLanguages), so adding
      # or removing an extractor directory changes the generated matrix. Without
      # this path the one job that catches a stale matrix cannot run on the only
      # change that makes it stale (#6332).
      - 'internal/extractors/**'
  push:
    branches: [main]
    paths:
      - 'docs/coverage/**'
      - 'tools/coverage/**'
      # The supported-language list is derived from internal/extractors/<lang>/
      # at run time (tools/coverage/languages.go SupportedLanguages), so adding
      # or removing an extractor directory changes the generated matrix. Without
      # this path the one job that catches a stale matrix cannot run on the only
      # change that makes it stale (#6332).
      - 'internal/extractors/**'
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      # The AUTHORITATIVE, unconditional copy of this gate now lives in
      # test.yml, which has no path filter on `pull_request` — see #6352 for
      # why the filter above could never fire on 76.8% of the cited paths.
      # This copy is deliberately RETAINED rather than moved, because it is not
      # redundant: this workflow also runs on `push: main`, a leg test.yml does
      # not subscribe to (test.yml reaches `push` only via release.yml's
      # workflow_call on a v* tag). Deleting it here would silently drop the
      # post-merge run. It costs ~11s on the minority of runs that clear the
      # path filter.
      #
      # ONE step, deliberately (#6866). This job used to list the gate's five
      # steps itself: three were `./tools/coverage` subcommands, and two —
      # `gen`, then a comparison against working-tree state — existed nowhere
      # but in this file. There was therefore NO local command that reproduced
      # the gate: all three subcommands could exit 0 on a tree CI was red on,
      # which cost PR #6864 two CI cycles. The step list now lives in exactly
      # one place, gateSteps() in tools/coverage/check.go, so the workflow and
      # the local command CANNOT drift as steps are added. Do not re-inline the
      # steps here — add them to gateSteps() and both sides get them.
      #
      # `check` still reports each step separately and keeps each step's
      # error annotation, so a failure names which of the five failed and what
      # to run; and it keeps the #6354 property that a page `gen` newly emits
      # (untracked, possibly unreferenced by summary.md) fails the gate.
      - name: Run the coverage-docs gate (tools/coverage/check.go gateSteps)
        run: go run ./tools/coverage check
