name: coverage-docs
on:
  pull_request:
    paths:
      - 'docs/coverage/**'
      - 'tools/coverage/**'
      # The supported-language list is derived from internal/extractors/<lang>/
      # at run time (tools/coverage/languages.go SupportedLanguages), so adding
      # or removing an extractor directory changes the generated matrix. Without
      # this path the one job that catches a stale matrix cannot run on the only
      # change that makes it stale (#6332).
      - 'internal/extractors/**'
  push:
    branches: [main]
    paths:
      - 'docs/coverage/**'
      - 'tools/coverage/**'
      # The supported-language list is derived from internal/extractors/<lang>/
      # at run time (tools/coverage/languages.go SupportedLanguages), so adding
      # or removing an extractor directory changes the generated matrix. Without
      # this path the one job that catches a stale matrix cannot run on the only
      # change that makes it stale (#6332).
      - 'internal/extractors/**'
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      # The AUTHORITATIVE, unconditional copy of this check now lives in
      # test.yml, which has no path filter on `pull_request` — see #6352 for
      # why the filter below could never fire on 76.8% of the cited paths.
      # This copy is deliberately RETAINED rather than moved, because it is not
      # redundant: this workflow also runs on `push: main`, a leg test.yml does
      # not subscribe to (test.yml reaches `push` only via release.yml's
      # workflow_call on a v* tag). Deleting it here would silently drop the
      # post-merge validate. It costs ~11s on the minority of runs that clear
      # the path filter.
      - name: Validate schema + cites
        run: go run ./tools/coverage validate
      - name: Guard against incomplete grouped records (#2971)
        run: go run ./tools/coverage backfill --check
      - name: Verify registry.json is canonical (guards against recompaction, #2907)
        run: |
          if ! go run ./tools/coverage fmt --check; then
            echo "::error::docs/coverage/registry.json is not canonical (likely whole-file re-serialized/compacted). Run 'go run ./tools/coverage fmt' locally and commit."
            exit 1
          fi
      - name: Regenerate docs
        run: go run ./tools/coverage gen
      - name: Verify docs are in sync with JSON
        run: |
          if ! git diff --exit-code docs/coverage/; then
            echo "::error::docs/coverage/*.md is stale. Run 'go run ./tools/coverage gen' locally and commit."
            exit 1
          fi
