frameworks:
  name: GraphQL Schema
  language: graphql
  category: schema_definition
  detection:
    file_extensions:
      - .graphql
      - .gql
    content_patterns:
      - "type Query"
      - "type Mutation"
      - "type Subscription"
  notes: >-
    Generic GraphQL schema extraction. Detects type definitions, queries,
    mutations, subscriptions, enums, inputs, and interfaces from .graphql files.

# ---------------------------------------------------------------------------
# Extraction schema (FrameworkExtractionSchema —)
# ---------------------------------------------------------------------------

file_conventions:
  - glob: "*.graphql"
    entity_type: Config
    name_from: filename
  - glob: "*.gql"
    entity_type: Config
    name_from: filename
  - glob: "**/schema.graphql"
    entity_type: Config
    name_from: filename

source_patterns:
  # type Query { ... }
  - pattern: "type\\s+(Query)\\b"
    entity_type: Controller
    name_group: 1
    scope: file
  # type Mutation { ... }
  - pattern: "type\\s+(Mutation)\\b"
    entity_type: Controller
    name_group: 1
    scope: file
  # type Subscription { ... }
  - pattern: "type\\s+(Subscription)\\b"
    entity_type: Controller
    name_group: 1
    scope: file
  # Custom object type: type User { ... }
  - pattern: "type\\s+(\\w+)\\s*(?:implements\\s+\\w+\\s*)?\\{"
    entity_type: Model
    name_group: 1
    scope: file
  # Input type: input CreateUserInput { ... }
  - pattern: "input\\s+(\\w+)\\s*\\{"
    entity_type: Model
    name_group: 1
    scope: file
  # Enum: enum Status { ... }
  - pattern: "enum\\s+(\\w+)\\s*\\{"
    entity_type: Model
    name_group: 1
    scope: file
  # Interface: interface Node { ... }
  - pattern: "interface\\s+(\\w+)\\s*\\{"
    entity_type: Interface
    name_group: 1
    scope: file
  # Union: union SearchResult = User | Post
  - pattern: "union\\s+(\\w+)\\s*="
    entity_type: Model
    name_group: 1
    scope: file
  # Directive definition: directive @auth on FIELD_DEFINITION
  - pattern: "directive\\s+@(\\w+)"
    entity_type: Decorator
    name_group: 1
    scope: file
  # NO `Operation` RULE HERE. #6927 came to widen it and measured it away
  # instead — the second rule this file has lost to a duplicate producer, and
  # for the same reason as the `implements` rule below.
  #
  # It read:
  #
  #     - pattern: "^\\s+(\\w+)\\s*\\([^)]*\\)\\s*:"
  #       entity_type: Operation
  #       name_group: 1
  #       scope: file
  #
  # Compiled by detector.go:156 with plain regexp.Compile, so `^` meant start
  # of TEXT: it fired only on a file whose very first bytes are whitespace
  # followed by a field declaration. Measured over 1907 real `.graphql`/`.gql`
  # files (relay, gqlgen, graphiql, graphql-js, apollo-client): ZERO matches.
  # The rule has never produced anything.
  #
  # Under `(?m)` it matches 1429 times in 160 of those files, and all 160 are
  # SDL documents — classified by whether the file carries a `type`/`input`/
  # `interface`/`enum`/`union`/`scalar`/`extend`/`schema`/`directive`
  # definition at all — with ZERO matches in a pure operation document. So the
  # widening is not an over-fire across file kinds, which is what #6927 sent
  # this arm to look for. The reason it is still wrong is narrower and worse.
  #
  # internal/extractors/graphql emits the fields of a `type`/`interface`/`input`
  # DEFINITION as their own `SCOPE.Component` (subtype `field`) named
  # `Owner.field`, with a CONTAINS edge from the owner (graphql.go:236-270).
  # This rule captured a subset of those — only fields carrying an argument
  # list — under a different kind and a BARE name, which drops the owner and
  # collapses two same-named fields on different types into one entity per file.
  #
  # It is a subset THERE and not everywhere, and the difference is load-bearing
  # enough that PR #6953 review had to correct an earlier version of this
  # comment: the extractor's `extend type Foo { … }` branch (graphql.go:350)
  # emits an IMPORTS/FEDERATES stub and NO field entities at all. That is how
  # every Apollo Federation subgraph declares its fields, and gqlgen and
  # apollo-client are both in the corpus measured above. So "the extractor
  # already covers it" is NOT why this rule is gone. It is gone because at HEAD
  # it produces nothing (0 of 1907 files) and, widened, it does active harm:
  #
  # resolve/refs.go's isOperationKind is `k == "SCOPE.Operation" || k ==
  # "Operation"`, so an entity of kind `Operation` is a first-class candidate
  # whenever the resolver binds an operation reference by BARE name — and the
  # http_endpoint synthesis emits `SCOPE.Operation "QUERY /node"` carrying a
  # bare `handler_ref: node`. A bare `Operation|node` therefore OUTRANKS the
  # owner-qualified `SCOPE.Component|Query.node`. That is the mechanism, and it
  # is invisible to recall. Measured on internal/quality/golden/graphql-schema-mini
  # by running the pipeline with `(?m)` added: entity_recall stayed 100%,
  # relationship_recall stayed 100%, forbidden hits stayed 0 — and TWO SERVES
  # edges silently moved. The http_endpoint synthesis emits
  # `SCOPE.Operation "QUERY /node"` with `handler_ref: node`, a BARE name that
  # the resolver binds to the field. With this rule widened, the new bare
  # `Operation|node` outranked `SCOPE.Component|Query.node` and
  # `QUERY /node --SERVES-->` repointed onto it, losing the owner
  # qualification; `QUERY /user` did the same. `QUERY /posts` and
  # `QUERY /settings` were untouched, because their fields take no arguments —
  # which is what makes the two moved edges attributable to this rule and not
  # to the schema.
  #
  # Removal is behaviour-preserving TODAY on every input measured (0 matches
  # in 1907 files), so nothing is lost by it and the `(?m)` landmine is gone.
  #
  # What is NOT closed, and should not be read as closed: widening this rule
  # and OWNER-QUALIFYING the capture — emitting `Owner.field`, or any kind
  # isOperationKind does not accept — would reach 1429 sites across 160 SDL
  # files, including the `extend type` fields the extractor does not model at
  # all. That is a real recall opportunity and the reason this comment says
  # what the ban actually rests on. Only a BARE-named `Operation` is banned.
  #
  # The graded consequence lives in graphql-schema-mini's expected.json:
  # `QUERY /node --SERVES--> Query.node` and `QUERY /user --SERVES--> Query.user`
  # are must_exist rows and `Operation|node` / `Operation|user` are forbidden
  # entities. Re-adding this rule in any form fails all four; `QUERY /posts
  # --SERVES--> Query.posts` is carried alongside as a control that passes in
  # both worlds, so a failure there means something other than this rule moved.
  # TestIssue6927_GraphQL_NoOperationSourcePattern (internal/engine) fails if a
  # source_pattern emitting `Operation` returns to this file at all.

relationship_rules:
  # NO `implements` RULE HERE. #6370 gave internal/extractors/graphql its own
  # IMPLEMENTS emission, and keeping this one made the graph report the same
  # fact twice: measured on internal/quality/golden/graphql-schema-mini, a
  # schema declaring 6 `implements` facts produced 8 IMPLEMENTS edges, with
  # `User -> Node` and `Post -> Node` each appearing once from here and once
  # from the extractor. Asking "what does User implement" answered `Node`
  # twice.
  #
  # The extractor is the surviving producer because this rule was a strict
  # subset of it and strictly worse: it matched `type` owners only (never
  # `interface X implements Y`), took only the FIRST name of an
  # `implements A & B & C` list, and — being unanchored and comment-blind —
  # fired on a COMMENTED-OUT `# type Ghost implements Node {`, minting the
  # `Ghost` entity to hang the edge on as well.
  #
  # TestGraphQLImplementsHasExactlyOneProducer (internal/extractors/graphql)
  # drives BOTH producers over the golden fixture and fails if either this
  # rule returns or the two ever emit the same pair again.
  # Field references another type: fieldName: TypeName
  - pattern: "\\s+(\\w+)\\s*:\\s*\\[?(\\w+)\\]?"
    source_type: Model
    target_type: Model
    relationship: CALLS
    source_group: 1
    target_group: 2
