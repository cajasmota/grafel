frameworks:
  name: LangChain.js
  npm_package: langchain
  category: ai_framework
  github_stars_2025: 14000+
  gateway: library
  detection:
    config_files: []
    dependency_names:
    - langchain
    - "@langchain/core"
    - "@langchain/community"
    - "@langchain/openai"
    - "@langchain/anthropic"
    import_markers:
    - from "langchain
    - from "@langchain/core
    - from "@langchain/community
    - from "@langchain/openai
    - from "@langchain/anthropic
    - import { } from "langchain
    structural_markers: []
  notes: >
    LangChain TypeScript/JavaScript SDK. Detection via npm dependencies and
    import patterns. No framework-specific config files.

# ---------------------------------------------------------------------------
# Extraction schema (FrameworkExtractionSchema)
# ---------------------------------------------------------------------------

file_conventions: []

source_patterns:
  # --- chain_composition (#2865) -----------------------------------------
  # LCEL .pipe() chain stage. Captures the upstream runnable variable so the
  # chain stage is a queryable Operation (e.g. "prompt" in prompt.pipe(model)).
  - pattern: "(\\w+)\\.pipe\\s*\\("
    entity_type: Operation
    name_group: 1
    scope: file
  # #6916 Tier C: `RunnableSequence.from(` used to mint an Operation entity
  # literally NAMED "RunnableSequence.from(" via `name_group: 0`, trailing
  # paren included. The `.pipe()` rule above is the bindable form of the same
  # LCEL composition fact (it captures the upstream runnable variable).
  # --- prompt_template_extraction (#2865) ---------------------------------
  # ChatPromptTemplate.fromMessages(...) / .fromTemplate(...) and the bare
  # PromptTemplate.fromTemplate(...) factory. Captures the template-class +
  # factory call so the prompt is a queryable Schema entity.
  - pattern: "(ChatPromptTemplate|PromptTemplate|FewShotPromptTemplate|SystemMessagePromptTemplate|HumanMessagePromptTemplate)\\.(?:fromTemplate|fromMessages)\\s*\\("
    entity_type: Schema
    name_group: 1
    scope: file
  # new ChatPromptTemplate(...) / new PromptTemplate(...) constructor form.
  - pattern: "new\\s+(ChatPromptTemplate|PromptTemplate|FewShotPromptTemplate)\\s*\\("
    entity_type: Schema
    name_group: 1
    scope: file
  # --- tool_use_detection (#2865) -----------------------------------------
  # DynamicTool / DynamicStructuredTool constructors and the tool() factory
  # (the three idiomatic ways to declare a LangChain tool an agent can call).
  - pattern: "new\\s+(DynamicTool|DynamicStructuredTool)\\s*\\("
    entity_type: Operation
    name_group: 1
    scope: file
  # #6916 Tier C: the `tool(async (` and `.bindTools(` rules used to mint
  # Operation entities literally NAMED "tool(async (" and ".bindTools(" via
  # `name_group: 0` — call-site fragments with no referent. Both survive
  # dropStatementNoiseOperations (measured: its noise predicate keys on a
  # leading "@", a bare "=", or a leading statement keyword, none of which a
  # trailing-paren fragment has), so this IS a deliberate removal of entities
  # that reach the graph, not the deletion of an already-suppressed rule. The
  # `new DynamicTool(...)` / `new DynamicStructuredTool(...)` rule above keeps
  # the named form of the tool-declaration fact.
  # --- agents -------------------------------------------------------------
  # Agent factory (createReactAgent, createToolCallingAgent, …).
  - pattern: "create\\w+Agent\\s*\\("
    entity_type: Service
    name_group: 0
    scope: file

relationship_rules: []

