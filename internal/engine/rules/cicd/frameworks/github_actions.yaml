frameworks:
  name: GitHub Actions
  language: cicd
  official_docs: https://docs.github.com/en/actions
  config_file: .github/workflows/*.yml
  adopted_by: GitHub repositories (native integration)
  vera_scope: Service (pipeline as Service, job as Operation)
  characteristics:
    - Event-driven (push, pull_request, schedule, workflow_dispatch)
    - Multi-job parallelism by default
    - Native secret management via GitHub secrets
    - Extensive marketplace of reusable actions
    - Matrix builds for parameterised job expansion
    - Self-hosted and GitHub-hosted runners
  complexity_signal_markers:
    - Job count > 10
    - Workflow count > 5
    - Matrix dimensions > 3
    - Conditional job chains > 4 levels deep

# ---------------------------------------------------------------------------
# Extraction schema (FrameworkExtractionSchema —)
# ---------------------------------------------------------------------------

file_conventions:
  - glob: ".github/workflows/*.yml"
    entity_type: Config
    name_from: filename
  - glob: ".github/workflows/*.yaml"
    entity_type: Config
    name_from: filename
  - glob: ".github/actions/*/action.yml"
    entity_type: Component
    name_from: filename

source_patterns:
  # Workflow name
  - pattern: "^name:\\s+[\"']?([^\"'\\n]+)"
    entity_type: Service
    name_group: 1
    scope: file
  # Job definition
  - pattern: "^\\s{2}(\\w[\\w-]*):\\s*\\n\\s+(?:runs-on|uses):"
    entity_type: Operation
    name_group: 1
    scope: file
  # Step with uses: (reusable action)
  - pattern: "uses:\\s+(\\S+)"
    entity_type: Dependency
    name_group: 1
    scope: file
  # Step with name:
  - pattern: "^\\s+-\\s+name:\\s+[\"']?([^\"'\\n]+)"
    entity_type: Task
    name_group: 1
    scope: file
  # on: trigger events
  - pattern: "^on:\\s*\\n\\s+(\\w+):"
    entity_type: Config
    name_group: 1
    scope: file
  # on: single event
  - pattern: "^on:\\s+(\\w+)"
    entity_type: Config
    name_group: 1
    scope: file
  # env: at workflow level
  - pattern: "^env:\\s*\\n\\s+(\\w+):"
    entity_type: Config
    name_group: 1
    scope: file
  # secrets reference
  - pattern: "secrets\\.(\\w+)"
    entity_type: Config
    name_group: 1
    scope: file
  # runs-on: runner
  - pattern: "runs-on:\\s+(\\S+)"
    entity_type: Config
    name_group: 1
    scope: file

relationship_rules:
  # REMOVED (#6809) — "Job needs another job":
  #
  #   pattern: "needs:\\s+\\[?([\\w-]+)"
  #   source_type: Operation  target_type: Operation
  #   source_group: 1  target_group: 1
  #
  # `needs: build` captures the DEPENDED-ON job, which is the target. The
  # depending job is the enclosing YAML key two lines up, and the pattern never
  # sees it — so naming group 1 for both endpoints emitted
  # `Operation:build -[CALLS]-> Operation:build`, a literal self-loop for every
  # `needs:` in every workflow.
  #
  # Not repaired by mirroring the `uses:` rule below. That rule's
  # `(\\w[\\w-]*):[\\s\\S]*?` window is positional, not structural: with several
  # jobs in one file the FIRST job key pairs with a LATER job's `needs:`, which
  # is one false edge plus one missing edge (#6666), and a workflow with one
  # `uses:` per job hides that while a `needs:` graph — where every job but the
  # first has one — would not. It also drops all but the first entry of a
  # `needs: [a, b, c]` list. Job dependency wants the YAML structure, not a
  # regex window over it.
  # uses: reusable action
  - pattern: "(\\w[\\w-]*):[\\s\\S]*?uses:\\s+(\\S+)"
    source_type: Operation
    target_type: Dependency
    relationship: CALLS
    source_group: 1
    target_group: 2
