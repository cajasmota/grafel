# Actix-web framework extraction rules
# Schema: FrameworkExtractionSchema
# Crate: actix-web
#
# Top-level `frameworks:` key is consumed by the modular_loader (detection).
# Top-level extraction keys are consumed by FrameworkExtractionSchema.

frameworks:
  name: Actix-web
  category: web_framework
  crate: actix-web
  detection:
    config_files:
    - Cargo.toml
    code_patterns:
    - "actix-web"
    - "#[actix_web::main]"
    - HttpServer::new(
    import_patterns:
    - "use actix_web::"

# ---------------------------------------------------------------------------
# Extraction schema (FrameworkExtractionSchema —)
# ---------------------------------------------------------------------------

file_conventions:
  # Handler modules grouped in handlers/ or routes/ directories
  - glob: "*/handlers/*.rs"
    entity_type: Operation
    name_from: filename
  - glob: "*/routes/*.rs"
    entity_type: Route
    name_from: filename
  # Service / application layer modules
  - glob: "*/services/*.rs"
    entity_type: Service
    name_from: filename
  # Data model / entity modules
  - glob: "*/models/*.rs"
    entity_type: Model
    name_from: filename

source_patterns:
  # Actix macro-based route registration on async functions:
  # #[get("/path")]  #[post("/path")]  #[put("/path")]  #[delete("/path")]
  # #[patch("/path")] #[head("/path")] #[options("/path")] #[route("/path")]
  - pattern: "#\\[(?:get|post|put|delete|patch|head|options|route)\\s*\\(\\s*\"([^\"]+)\""
    entity_type: Operation
    name_group: 1
    scope: function

  # web::resource("/path").route(...) — resource-style registration
  - pattern: "web::resource\\s*\\(\\s*\"([^\"]+)\""
    entity_type: Route
    name_group: 1
    scope: file

  # web::scope("/prefix") — route grouping
  - pattern: "web::scope\\s*\\(\\s*\"([^\"]+)\""
    entity_type: Route
    name_group: 1
    scope: file

  # Explicit route registration: .route("/path", web::get().to(...))
  - pattern: "\\.route\\s*\\(\\s*\"([^\"]+)\""
    entity_type: Route
    name_group: 1
    scope: file

  # Handler function: async fn name(req: HttpRequest, ...) — captures handler name
  # Matches async fn with at least one actix extractor type in args
  - pattern: "async\\s+fn\\s+(\\w+)\\s*\\([^)]*(?:HttpRequest|web::|Data<|Json<|Path<|Query<|Form<)[^)]*\\)"
    entity_type: Operation
    name_group: 1
    scope: function

  # Data<T> application state injection in function args — captures T as dependency
  - pattern: "Data\\s*<\\s*([\\w:]+)\\s*>"
    entity_type: Dependency
    name_group: 1
    scope: function

  # HttpServer::new(...).bind(...) — application entry point
  - pattern: "HttpServer\\s*::\\s*new\\s*\\("
    entity_type: Config
    name_group: 0
    scope: file

  # #6916 Tier C: the `#[actix_web::main]` attribute-macro marker used to mint a
  # Config entity literally NAMED "#[actix_web::main]" via `name_group: 0` — a
  # per-file boolean ("this file has the actix main macro") with no referent for
  # any edge to point at, and no relationship_rule in the rust bucket names
  # Config as an endpoint, so it carried zero edges. It was also the THIRD
  # marker on the same concept: `HttpServer::new(` and `App::new()` below fire
  # on the same main.rs and mean the same thing ("server entry point"). Those
  # two are kept (Tier D still owes them a real name); this one is deleted
  # rather than renamed because a bare attribute macro has no name to capture.
  # The attribute is not lost as a FACT either: internal/substrate/
  # entry_points_rust.go lists `actix_web::main` in rustLifecycleAttrs and reads
  # it for entry-point classification, which is the modelled form of exactly
  # what this marker gestured at.

  # App::new() — application builder (middleware config point)
  - pattern: "App\\s*::\\s*new\\s*\\(\\s*\\)"
    entity_type: Config
    name_group: 0
    scope: file

  # .wrap(Middleware) — middleware registration
  # Captures only the struct/type name before any :: or ( to avoid capturing method calls
  - pattern: "\\.wrap\\s*\\(\\s*(\\w+)"
    entity_type: Middleware
    name_group: 1
    scope: file


relationship_rules:
  # Macro route connects path to the function immediately following it:
  # #[get("/path")] \n async fn handler_name
  - pattern: "#\\[(?:get|post|put|delete|patch|head|options|route)\\s*\\(\\s*\"([^\"]+)\"[^)]*\\)\\s*\\][\\s\\S]{0,200}?async\\s+fn\\s+(\\w+)"
    source_type: Operation
    target_type: Operation
    relationship: ROUTES_TO
    source_group: 1
    target_group: 2

  # web::scope("/prefix") contains .route("/sub") — nested routing
  - pattern: "web::scope\\s*\\(\\s*\"([^\"]+)\"[^)]*\\)[\\s\\S]{0,400}?\\.route\\s*\\(\\s*\"([^\"]+)\""
    source_type: Route
    target_type: Route
    relationship: ROUTES_TO
    source_group: 1
    target_group: 2

  # Data<T> dependency injected into handler fn
  - pattern: "Data\\s*<\\s*([\\w:]+)\\s*>[\\s\\S]{0,300}?async\\s+fn\\s+(\\w+)"
    source_type: Dependency
    target_type: Operation
    relationship: INJECTED_INTO
    source_group: 1
    target_group: 2
