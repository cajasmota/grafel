# FastAPI framework extraction rules.
#
# Top-level `frameworks:` key is consumed by the modular_loader (detection).
# Top-level extraction keys (file_conventions, source_patterns,
# relationship_rules) are consumed by FrameworkExtractionSchema.
#
frameworks:
  name: FastAPI
  pypi_package: fastapi
  category: web_async_api
  github_stars_2025: 96600+
  gateway: asgi
  detection:
    config_files:
    - main.py
    - app.py
    - '*/routers/*.py'
    dependency_names:
    - fastapi
    import_markers:
    - from fastapi import FastAPI
    - FastAPI()
    - APIRouter()
    structural_markers:
    - routers/ directory
  notes: >
    Typically co-detected with uvicorn and pydantic. Routers pattern (APIRouter)
    is high-confidence for FastAPI vs Starlette.

# ---------------------------------------------------------------------------
# Extraction schema (FrameworkExtractionSchema —)
# ---------------------------------------------------------------------------

# file_conventions: glob -> entity_type mapping from file naming conventions.
file_conventions:
  - glob: "*/routers/*.py"
    entity_type: Route
    name_from: filename
  - glob: "*/dependencies/*.py"
    entity_type: Service
    name_from: filename
  - glob: "*/schemas/*.py"
    entity_type: Model
    name_from: filename
  - glob: "*/models/*.py"
    entity_type: Model
    name_from: filename
  - glob: "*/middleware/*.py"
    entity_type: Middleware
    name_from: filename

# source_patterns: regex patterns that match framework constructs in source.
# name_group references the capture group that provides the entity name.
source_patterns:
  # Route decorators: @app.get("/path") or @router.get("/path")
  - pattern: "@(?:app|router)\\.(get|post|put|patch|delete|head|options|trace)\\(\\s*[\"']([^\"']+)[\"']"
    entity_type: Route
    name_group: 2
    scope: file
  # APIRouter instantiation: router = APIRouter(prefix="/items")
  - pattern: "(\\w+)\\s*=\\s*APIRouter\\s*\\("
    entity_type: Route
    name_group: 1
    scope: file
  # FastAPI app instantiation: app = FastAPI(...)
  - pattern: "(\\w+)\\s*=\\s*FastAPI\\s*\\("
    entity_type: Service
    name_group: 1
    scope: file
  # Dependency injection via Depends: def func(dep: SomeType = Depends(...))
  - pattern: "def\\s+(\\w+)\\s*\\([^)]*Depends\\s*\\("
    entity_type: Dependency
    name_group: 1
    scope: function
  # Pydantic model definitions used as request/response schemas
  - pattern: "class\\s+(\\w+)\\s*\\(\\s*(?:BaseModel|pydantic\\.BaseModel)\\s*\\)"
    entity_type: Model
    name_group: 1
    scope: class
  # Middleware via @app.middleware("http")
  - pattern: "@(?:app|router)\\.middleware\\s*\\(\\s*[\"'](\\w+)[\"']"
    entity_type: Middleware
    name_group: 1
    scope: file

# relationship_rules: regex patterns that produce edges between entities.
# source_group / target_group reference capture groups for entity names.
relationship_rules:
  # Handler uses an injected dependency: handler IMPORTS provider.
  #
  # #6444 — this rule used to read `Route:<handler-fn> -> Service:<provider>`
  # and BOTH ends were unmintable. A FastAPI Route entity is only ever named
  # by the decorator PATH, the APIRouter variable, or the filename (see
  # source_patterns above) — never by a handler function. And `Service:` has
  # exactly one producer, `app = FastAPI(`, so `Service:get_db` names nothing
  # either. The `Dependency` rule is no help: it is `scope: function` and
  # captures the OUTER function, so it mints `Dependency:<handler>`, not
  # `Dependency:<provider>`.
  #
  # Both names DO exist — as generic-Python-extractor operations, kind
  # `SCOPE.Operation`, which the resolver's byKind index also carries under
  # the trimmed `Operation` key. That is what these anchor on now.
  - pattern: "def\\s+(\\w+)\\s*\\([^)]*=\\s*Depends\\(\\s*(\\w+)\\s*\\)"
    source_type: Operation
    target_type: Operation
    relationship: IMPORTS
    source_group: 1
    target_group: 2
  # Dependency injected into route handler: provider INJECTED_INTO handler.
  # #6444 — was `Dependency:<provider> -> Route:<handler>`; same two defects
  # as the rule above, mirrored.
  - pattern: "def\\s+(\\w+)\\s*\\([^)]*=\\s*Depends\\(\\s*(\\w+)\\s*\\)"
    source_type: Operation
    target_type: Operation
    relationship: INJECTED_INTO
    source_group: 2
    target_group: 1
  # Router registered on app: app.include_router(router, ...)
  - pattern: "(\\w+)\\.include_router\\s*\\(\\s*(\\w+)"
    source_type: Service
    target_type: Route
    relationship: ROUTES_TO
    source_group: 1
    target_group: 2
  # Handler decorated by route decorator.
  #
  # #6444 — the old pattern discarded the path (`\\([^)]*\\)`) and then used
  # the HANDLER capture for both ends: `Route:<handler> -> Service:<handler>`.
  # Neither name is mintable. The path is right there in the matched text, so
  # capture it: group 1 is now byte-identical to the name the Route
  # source_pattern mints at `name_group: 2` above, and group 2 is the handler,
  # which the generic extractor mints as `SCOPE.Operation` (indexed under the
  # trimmed `Operation` key).
  - pattern: "@(?:app|router)\\.(?:get|post|put|patch|delete)\\(\\s*[\"']([^\"']+)[\"'][^)]*\\)\\s*\\ndef\\s+(\\w+)"
    source_type: Route
    target_type: Operation
    relationship: DECORATES
    source_group: 1
    target_group: 2

# These run after YAML-driven extraction and contribute additional entities +
# relationships to the pipeline result.
