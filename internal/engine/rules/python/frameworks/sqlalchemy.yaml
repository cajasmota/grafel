# SQLAlchemy framework extraction rules.
#
# Top-level `frameworks:` key is consumed by the modular_loader (detection).
# Top-level extraction keys (file_conventions, source_patterns,
# relationship_rules) are consumed by FrameworkExtractionSchema.
#
frameworks:
  name: SQLAlchemy
  pypi_package: SQLAlchemy
  category: orm
  github_stars_2025: 10000+
  gateway: orm
  detection:
    config_files:
    - alembic.ini
    - '*/alembic/env.py'
    dependency_names:
    - SQLAlchemy
    - sqlalchemy
    import_markers:
    - from sqlalchemy
    - import sqlalchemy
    - from sqlalchemy.orm import
    - from sqlalchemy.ext.declarative import declarative_base
    - DeclarativeBase
    structural_markers:
    - alembic/ directory
    - alembic.ini
  notes: >
    declarative_base() or DeclarativeBase subclass is the definitive signal.
    create_engine() confirms active usage. alembic.ini indicates managed migrations.

# ---------------------------------------------------------------------------
# Extraction schema (FrameworkExtractionSchema —)
# ---------------------------------------------------------------------------

file_conventions:
  - glob: "*/models/*.py"
    entity_type: Model
    name_from: filename
  - glob: "*/models.py"
    entity_type: Model
    name_from: filename
  - glob: "*/db/*.py"
    entity_type: Schema
    name_from: filename
  - glob: "alembic/versions/*.py"
    entity_type: Migration
    name_from: filename

source_patterns:
  # declarative_base() assignment: Base = declarative_base()
  - pattern: "(\\w+)\\s*=\\s*declarative_base\\s*\\("
    entity_type: Schema
    name_group: 1
    scope: file
  # DeclarativeBase subclass: class Base(DeclarativeBase): pass
  #
  # `(?m)` is load-bearing (#6927). detector.go compiles these patterns with
  # plain regexp.Compile, so without it `^` meant start of TEXT and this rule
  # only fired when the declarative base opened the file. A models module opens
  # with a docstring or an import block, so it extracted nothing. No `$` in the
  # pattern, so `(?m)`'s other effect cannot reach it.
  #
  # No framework gate needed: the `DeclarativeBase` literal in the base list is
  # itself the SQLAlchemy evidence.
  - pattern: "(?m)^class\\s+(\\w+)\\s*\\([^)]*DeclarativeBase[^)]*\\)\\s*:"
    entity_type: Schema
    name_group: 1
    scope: class
  # Model class: class User(Base):
  #
  # `(?m)` for the same reason (#6927) — and `requires_framework` BECAUSE of it.
  #
  # Read literally, this pattern describes "a module-level class with exactly
  # one simple base", which is plain Python syntax and not a SQLAlchemy
  # construct at all: `class ConfigError(Exception):` and
  # `class Serializer(object):` both satisfy it. Detect resolves rule sets by
  # file.Language alone, so switching `(?m)` on without a gate would type EVERY
  # single-base class in EVERY indexed Python file as a `Model`. The start-of-
  # text anchor was the only thing holding that back, by accident.
  #
  # This is the same shape #6152 already had to gate for falcon.yaml and
  # cherrypy.yaml (`class Foo:` -> Controller), and it carries the same remedy:
  # the pattern now fires only in files whose content shows one of the
  # frameworks.detection.import_markers above. The trade is deliberate — a
  # models module that imports its Base from a sibling and names sqlalchemy
  # nowhere loses this entity (the `*/models.py` file_convention still types the
  # file), which is a far smaller cost than mistyping every class in the repo.
  - pattern: "(?m)^class\\s+([A-Z]\\w*)\\s*\\(\\w+\\)\\s*:"
    entity_type: Model
    name_group: 1
    scope: class
    requires_framework: true
  # create_engine: engine = create_engine("...")
  - pattern: "(\\w+)\\s*=\\s*create_(?:async_)?engine\\s*\\("
    entity_type: Service
    name_group: 1
    scope: file
  # relationship: items = relationship("Item")
  - pattern: "=\\s*relationship\\s*\\(\\s*[\"']([A-Za-z_]\\w*)[\"']"
    entity_type: Relationship
    name_group: 1
    scope: file
  # ForeignKey: ForeignKey("table.id")
  - pattern: "ForeignKey\\s*\\(\\s*[\"']([^\"']+)[\"']"
    entity_type: Constraint
    name_group: 1
    scope: file

# relationship_rules: intentionally empty (#6809).
#
# Both rules this file used to carry named capture group 1 and entity type
# `Model` for BOTH endpoints, so every edge either could emit was
# `FromID == ToID` by construction — not by accident, and not recoverable
# downstream. They are removed rather than repaired, for reasons that differ:
#
#   "from\\s+[\\w.]+\\s+import\\s+([A-Z]\\w*)"   DEPENDS_ON Model -> Model
#     Commented "Model imports another model", but the pattern names no module
#     and no framework: it matched EVERY capitalised import in EVERY Python
#     file, whether or not SQLAlchemy was anywhere near it. Over the golden
#     corpus it fired 12 times and produced 12 self-loops — `Model:JsonResponse`
#     and `Model:AppConfig` in a Django app, `Model:FastAPI` and
#     `Model:APIRouter` in a FastAPI app, `Model:Redis` and `Model:Queue` in an
#     RQ app. The intent it was reaching for is already expressed correctly, and
#     narrowly, twice: django.yaml's `from <app>.models import (\\w+)`
#     (View -> Model) and flask.yaml's `from [\\w.]+models import (\\w+)`
#     (both capture once and name two DIFFERENT endpoint types). Nothing is lost
#     with this gone.
#
#   "ForeignKey\\s*\\(\\s*[\"']([\\w]+)\\.[\\w]+[\"']"  DEPENDS_ON Model -> Model
#     `ForeignKey("users.id")` captures the REFERENCED table, which is the
#     target. The source is the class declaring the column — `class Order(Base)`
#     — and it is nowhere in the pattern. Reusing the referenced table for the
#     source does not encode a self-referential FK: it reports one for EVERY
#     foreign key, including `Order -> users`, so the edge is wrong exactly when
#     a self-FK is not what the source says. Recovering the real source needs
#     containment (which class body is this column in), and a regex `[\\s\\S]*?`
#     window across a Python class body is the #6666 false-pairing shape with no
#     terminator literal available to bound it. That wants a structural
#     extractor, not a wider regex.

