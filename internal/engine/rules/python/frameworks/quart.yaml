# Quart framework extraction rules. #3065
#
# Top-level `frameworks:` key is consumed by the modular_loader (detection).
# Top-level extraction keys (file_conventions, source_patterns,
# relationship_rules) are consumed by FrameworkExtractionSchema.
#
frameworks:
  name: Quart
  pypi_package: Quart
  category: web_async
  github_stars_2025: 2900+
  gateway: asgi
  detection:
    config_files:
    - app.py
    - .quartenv
    dependency_names:
    - Quart
    - quart
    import_markers:
    - from quart import Quart
    - Quart(__name__)
    structural_markers: []
  notes: >
    Quart is an async-first drop-in replacement for Flask. Its routing API is
    identical: @app.route('/path', methods=['GET','POST']), @app.get('/path'),
    @app.post('/path'), etc. Path parameters use the same Flask-style
    <converter:name> angle-bracket convention. The synthesizer runs BEFORE
    Flask so the framework label is correct, gated on the Quart import signal.

# ---------------------------------------------------------------------------
# Extraction schema (FrameworkExtractionSchema)
# ---------------------------------------------------------------------------

# source_patterns: regex patterns that match Quart constructs.
source_patterns:
  # Route decorator: @app.route("/path") or @bp.route("/path")
  - pattern: "@(\\w+)\\.route\\s*\\(\\s*[\"']([^\"']+)[\"']"
    entity_type: Route
    name_group: 2
    scope: file
  # HTTP method decorators: @app.get("/path"), @app.post("/path"), etc.
  #
  # requires_framework (#7013), MANDATORILY IN LOCKSTEP WITH flask.yaml's
  # identical pattern (#7028). This pattern is byte-identical to flask.yaml's
  # — same regex, same entity_type, same name_group — and `flask` sorts before
  # `quart` in the loader's fs.WalkDir order, so with the per-file, cross-rule-
  # set `seenEntities` dedup (detector.go:367) this twin has never minted
  # anything on a file flask also matched. Gating flask's copy while leaving
  # this one open does not remove the 75 Django false positives; it transfers
  # them here and mislabels 4 real Flask routes as Quart. Gate both or neither.
  # TestFlaskAndQuartRouteTwinsGatedTogether_7013 fails if they diverge.
  - pattern: "@(\\w+)\\.(get|post|put|patch|delete)\\s*\\(\\s*[\"']([^\"']+)[\"']"
    entity_type: Route
    name_group: 3
    scope: file
    requires_framework: true
  # Blueprint instantiation: bp = Blueprint("name", __name__)
  - pattern: "(\\w+)\\s*=\\s*Blueprint\\s*\\(\\s*[\"'](\\w+)[\"']"
    entity_type: Controller
    name_group: 2
    scope: file
  # Quart app instantiation: app = Quart(__name__)
  - pattern: "(\\w+)\\s*=\\s*Quart\\s*\\(\\s*__name__\\s*\\)"
    entity_type: Service
    name_group: 1
    scope: file
  # Error handler decorator: @app.errorhandler(404)
  - pattern: "@(\\w+)\\.errorhandler\\s*\\(\\s*(\\d+)\\s*\\)"
    entity_type: Middleware
    name_group: 2
    scope: file
  # Before/after request hooks: @app.before_request
  #
  # requires_framework (#7013). `@app.before_request` is Flask's decorator as
  # much as Quart's; all 43 of this pattern's corpus mints were in Flask repos
  # and none in a Quart repo. The corpus contains NO Quart user at all, so the
  # measured zero true-positive loss is "loses nothing here", not "loses
  # nothing" — recall for real Quart code is untested by that corpus and rests
  # on the fixture below.
  - pattern: "@(\\w+)\\.(before_request|after_request|teardown_request)\\s*[\\r\\n]+\\s*(?:async\\s+)?def\\s+(\\w+)"
    entity_type: Middleware
    name_group: 3
    scope: file
    requires_framework: true

# relationship_rules: edges between entities.
relationship_rules:
  # Blueprint registered on app: app.register_blueprint(bp, ...)
  - pattern: "(\\w+)\\.register_blueprint\\s*\\(\\s*(\\w+)"
    source_type: Module
    target_type: Service
    relationship: REGISTERED_ON
    source_group: 2
    target_group: 1
