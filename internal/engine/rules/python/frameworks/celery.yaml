# Celery task queue extraction rules.
#
# Top-level `frameworks:` key is consumed by the modular_loader (detection).
# Top-level extraction keys (file_conventions, source_patterns,
# relationship_rules) are consumed by FrameworkExtractionSchema.
#
frameworks:
  name: Celery
  pypi_package: celery
  category: task_queue
  github_stars_2025: 25000+
  gateway: amqp_redis
  detection:
    config_files:
    - celery.py
    - celeryconfig.py
    - '*/tasks.py'
    - '*/tasks/*.py'
    dependency_names:
    - celery
    import_markers:
    - from celery import Celery
    - app = Celery
    - '@app.task'
    - '@shared_task'
    structural_markers:
    - tasks.py
    - celeryconfig.py
  notes: >
    Often co-deployed with Django or Flask. tasks.py with @app.task or @shared_task
    is definitive. Beat scheduler uses beat_schedule.

# ---------------------------------------------------------------------------
# Extraction schema (FrameworkExtractionSchema —)
# ---------------------------------------------------------------------------

# file_conventions: glob -> entity_type mapping from file naming conventions.
file_conventions:
  - glob: "*/tasks.py"
    entity_type: Service
    name_from: filename
  - glob: "*/tasks/*.py"
    entity_type: Service
    name_from: filename
  - glob: "celery.py"
    entity_type: Config
    name_from: filename
  - glob: "celeryconfig.py"
    entity_type: Config
    name_from: filename

# source_patterns: regex patterns that match Celery constructs in source files.
source_patterns:
  # @app.task decorator (with optional args): most common task definition
  - pattern: "@(\\w+)\\.task(?:\\s*\\([^)]*\\))?\\s*\\ndef\\s+(\\w+)"
    entity_type: Task
    name_group: 2
    scope: file
  # @app.task with explicit queue kwarg: @app.task(queue='name')
  - pattern: "@(?:\\w+)\\.task\\s*\\([^)]*queue\\s*=\\s*[\"'](\\w+)[\"'][^)]*\\)\\s*\\ndef\\s+(\\w+)"
    entity_type: Task
    name_group: 2
    scope: file
  # @shared_task decorator (Django integration — no app reference needed)
  - pattern: "@shared_task(?:\\s*\\([^)]*\\))?\\s*\\ndef\\s+(\\w+)"
    entity_type: Task
    name_group: 1
    scope: file
  # Celery app instantiation: app = Celery("name", broker="...")
  - pattern: "(\\w+)\\s*=\\s*Celery\\s*\\(\\s*[\"'](\\w+)[\"']"
    entity_type: Config
    name_group: 2
    scope: file
  # Celery beat periodic task via beat_schedule dict
  - pattern: "[\"'](\\w[\\w.]+)[\"']:\\s*\\{[^}]*task[\"']:\\s*[\"']([^\"']+)[\"']"
    entity_type: Task
    name_group: 1
    scope: file
  # Task base class: class MyTask(Task): or class MyTask(celery.Task):
  - pattern: "class\\s+(\\w+)\\s*\\(\\s*(?:celery\\.)?Task\\s*\\)"
    entity_type: Task
    name_group: 1
    scope: class
  # Celery config class (Django-style): class CeleryConfig:
  - pattern: "class\\s+(\\w+Config)\\s*(?:\\(\\s*\\))?\\s*:"
    entity_type: Config
    name_group: 1
    scope: class

# relationship_rules: regex patterns that produce edges between entities.
relationship_rules:
  # REMOVED (#6809) — "Task calls another task via .delay() / .apply_async()":
  #
  #   pattern: "(\\w+)\\.(?:delay|apply_async)\\s*\\("
  #   source_type: Task  target_type: Task  source_group: 1  target_group: 1
  #
  # `send_email.delay(...)` captures the CALLEE, which is the target. The caller
  # is the enclosing function, and the pattern never sees it — so naming group 1
  # for both endpoints emitted `Task:send_email -[CALLS]-> Task:send_email` for
  # every call site, a literal self-loop by construction rather than real
  # recursion. #6808 deliberately exempts CALLS from its self-loop drop because
  # a self-CALLS edge is usually genuine recursion worth keeping; that exemption
  # is exactly what let this rule's output through, and widening it would have
  # deleted real recursion to catch a rule-authoring defect.
  #
  # Not repaired here: recovering the caller needs containment (which `def` body
  # is this call in), and an `[\\s\\S]*?` window from a `def` header to a
  # `.delay(` is the #6666 false-pairing shape — Python has no block terminator
  # literal to bound it, and FindAllStringSubmatch's non-overlapping matches
  # would give each `def` at most one callee. The sibling composition rule below
  # shows the shape that DOES work: two captures inside one construct.
  # App config loaded via app.config_from_object
  - pattern: "(\\w+)\\.config_from_object\\s*\\(\\s*[\"']([^\"']+)[\"']"
    source_type: Config
    target_type: Task
    relationship: CONFIGURES
    source_group: 2
    target_group: 1
  # Chord/chain task composition: chain(task1.s() | task2.s())
  - pattern: "chain\\s*\\(\\s*(\\w+)\\.s\\s*\\([^)]*\\)\\s*\\|\\s*(\\w+)\\.s\\s*\\("
    source_type: Task
    target_type: Task
    relationship: CALLS
    source_group: 1
    target_group: 2

