# Fiber HTTP framework extraction rules
# Schema: FrameworkExtractionSchema
# Module: github.com/gofiber/fiber/v2 or github.com/gofiber/fiber/v3

file_conventions: []

source_patterns:
  # Route registration: app.Get("/path", handlerFunc)  (Fiber uses Title-case methods)
  - pattern: '\.\s*(?:Get|Post|Put|Patch|Delete|Head|Options|All|Connect|Trace)\s*\(\s*"([^"]+)"\s*,\s*(\w+)'
    entity_type: Route
    name_group: 1
    scope: file

  # Route group: app.Group("/prefix")
  - pattern: '\.Group\s*\(\s*"([^"]+)"\s*\)'
    entity_type: Route
    name_group: 1
    scope: file

  # Middleware registration: app.Use(middlewareFunc)
  - pattern: '\.Use\s*\(\s*(\w[\w.]*)\s*\)'
    entity_type: Middleware
    name_group: 1
    scope: file

  # Handler function: func handlerName(c *fiber.Ctx) error
  - pattern: 'func\s+(\w+)\s*\(\s*\w+\s+\*fiber\.Ctx\s*\)\s*error'
    entity_type: Controller
    name_group: 1
    scope: file

  # fiber.New() app init
  # fiber.New() app init, named after the ASSIGNED VARIABLE (#6916): app := fiber.New()
  # name_group 0 named this entity "fiber.New()" — a marker string, one per FILE, that no
  # edge could ever bind to. Naming the variable is also what makes a PER-ROUTER
  # anchor possible (#6914): a file building two routers now mints two entities.
  #
  # The `(?m)^[ \t]*` ANCHOR is load-bearing and graded. Without it the capture is
  # just "the token left of the `=`", which in Go is reached from inside comments
  # and doc examples — `// r := fiber.New()` would mint a plausible-looking
  # `Config:r` in a file that builds no router at all. `(?:\w+\.)?` keeps
  # `s.router = fiber.New()` naming `router` rather than `s`; the optional
  # `var` + type group is what lets `var r *fiber.App = fiber.New()` match at all.
  # Measured: Go puts the type AFTER the name, so deleting that group makes an
  # explicitly typed declaration mint NOTHING — it does not capture the type the
  # way the TypeScript sibling did (#6916 Tier B, review ask 2).
  - pattern: '(?m)^[ \t]*(?:var\s+)?(?:\w+\.)?(\w+)(?:\s+[\w.*\[\]]+)?\s*:?=\s*fiber\.New\s*\(\s*\)'
    entity_type: Config
    name_group: 1
    scope: file

relationship_rules:
  # Route CALLS handler: .Get("/path", handlerName) -> handlerName
  - pattern: '\.\s*(?:Get|Post|Put|Patch|Delete|Head|Options|All|Connect|Trace)\s*\(\s*"([^"]+)"\s*,\s*(\w+)'
    source_type: Route
    target_type: Controller
    relationship: ROUTES_TO
    source_group: 1
    target_group: 2

# These run after YAML-driven extraction and contribute additional entities +
# relationships to the pipeline result.
