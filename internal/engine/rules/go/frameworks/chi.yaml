# Chi HTTP router extraction rules
# Schema: FrameworkExtractionSchema
# Module: github.com/go-chi/chi/v5

file_conventions: []

source_patterns:
  # Route registration: r.Get("/path", handlerFunc)  (chi uses Title-case methods)
  - pattern: '\.\s*(?:Get|Post|Put|Patch|Delete|Head|Options|Connect|Trace)\s*\(\s*"([^"]+)"\s*,\s*(\w+)'
    entity_type: Route
    name_group: 1
    scope: file

  # Sub-router group: r.Route("/prefix", func(r chi.Router) { ... })
  - pattern: '\.Route\s*\(\s*"([^"]+)"\s*,'
    entity_type: Route
    name_group: 1
    scope: file

  # Mount sub-router: r.Mount("/prefix", handler)
  - pattern: '\.Mount\s*\(\s*"([^"]+)"\s*,\s*(\w+)'
    entity_type: Route
    name_group: 1
    scope: file

  # Middleware registration: r.Use(middlewareFunc)
  - pattern: '\.Use\s*\(\s*(\w[\w.]*)\s*\)'
    entity_type: Middleware
    name_group: 1
    scope: file

  # Handler function: func handlerName(w http.ResponseWriter, r *http.Request)
  - pattern: 'func\s+(\w+)\s*\(\s*\w+\s+http\.ResponseWriter\s*,\s*\w+\s+\*http\.Request\s*\)'
    entity_type: Controller
    name_group: 1
    scope: file

  # chi.NewRouter() init
  # chi.NewRouter() init, named after the ASSIGNED VARIABLE (#6916): r := chi.NewRouter()
  # name_group 0 named this entity "chi.NewRouter()" — a marker string, one per FILE, that no
  # edge could ever bind to. Naming the variable is also what makes a PER-ROUTER
  # anchor possible (#6914): a file building two routers now mints two entities.
  #
  # The `(?m)^[ \t]*` ANCHOR is load-bearing and graded. Without it the capture is
  # just "the token left of the `=`", which in Go is reached from inside comments
  # and doc examples — `// r := chi.NewRouter()` would mint a plausible-looking
  # `Config:r` in a file that builds no router at all. `(?:\w+\.)?` keeps
  # `s.router = chi.NewRouter()` naming `router` rather than `s`; the optional
  # `var` + type group is what lets `var r *chi.Mux = chi.NewRouter()` match at all.
  # Measured: Go puts the type AFTER the name, so deleting that group makes an
  # explicitly typed declaration mint NOTHING — it does not capture the type the
  # way the TypeScript sibling did (#6916 Tier B, review ask 2).
  - pattern: '(?m)^[ \t]*(?:var\s+)?(?:\w+\.)?(\w+)(?:\s+[\w.*\[\]]+)?\s*:?=\s*chi\.NewRouter\s*\(\s*\)'
    entity_type: Config
    name_group: 1
    scope: file

relationship_rules:
  # Route CALLS handler: .Get("/path", handlerName) -> handlerName
  - pattern: '\.\s*(?:Get|Post|Put|Patch|Delete|Head|Options|Connect|Trace)\s*\(\s*"([^"]+)"\s*,\s*(\w+)'
    source_type: Route
    target_type: Controller
    relationship: ROUTES_TO
    source_group: 1
    target_group: 2

  # Mount CALLS sub-handler: .Mount("/prefix", handlerName) -> handlerName
  - pattern: '\.Mount\s*\(\s*"([^"]+)"\s*,\s*(\w+)'
    source_type: Route
    target_type: Controller
    relationship: ROUTES_TO
    source_group: 1
    target_group: 2
