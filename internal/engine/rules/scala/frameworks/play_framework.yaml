# Play Framework extraction rules
# Schema: FrameworkExtractionSchema
# SBT: "com.typesafe.play" %% "play"
#
# Top-level `frameworks:` key is consumed by the modular_loader (detection).
# Top-level extraction keys are consumed by FrameworkExtractionSchema.

frameworks:
  name: Play Framework
  category: web_full_stack
  sbt_coordinates:
  - com.typesafe.play::play
  - com.typesafe.play::play-slick
  - com.typesafe.play::play-json
  - com.typesafe.play::play-ws
  detection:
    config_files:
    - conf/application.conf
    - conf/routes
    - conf/logback.xml
    - app/controllers/
    - app/views/
    - app/models/
    - build.sbt
    - project/plugins.sbt
    build_signals:
    - '"com.typesafe.play" %% "play"'
    - addSbtPlugin("com.typesafe.play" % "sbt-plugin")
    - PlayScala
    - enablePlugins(PlayScala)
    import_patterns:
    - import play.api.mvc._
    - import play.api.libs.json._
    - import play.api._
    code_patterns:
    - extends Controller
    - extends BaseController
    - Action {
    - Action.async {
    - Ok(Json.toJson(
    - Routes.
  notes: 'Full-stack MVC framework for Scala (and Java). Detection via conf/routes
    file is highly reliable — that path is unique to Play. The sbt plugin addSbtPlugin("com.typesafe.play"
    % "sbt-plugin") in project/plugins.sbt is definitive. conf/application.conf co-present
    with routes = confirmed Play. enablePlugins(PlayScala) or enablePlugins(PlayJava)
    in build.sbt is definitive.

    '

# ---------------------------------------------------------------------------
# Extraction schema (FrameworkExtractionSchema —)
# ---------------------------------------------------------------------------

file_conventions:
  # Play convention: controllers in app/controllers/
  - glob: "*/app/controllers/*.scala"
    entity_type: Controller
    name_from: class_name
  # Play convention: models in app/models/
  - glob: "*/app/models/*.scala"
    entity_type: Model
    name_from: class_name
  # Play convention: services in app/services/
  - glob: "*/app/services/*.scala"
    entity_type: Service
    name_from: class_name
  # Play Twirl templates
  - glob: "*/app/views/*.html"
    entity_type: View
    name_from: filename

source_patterns:
  # Controller class extending AbstractController, BaseController, or InjectedController
  # class HomeController @Inject()(cc: ControllerComponents) extends AbstractController(cc)
  # class ApiController extends BaseController {
  - pattern: "class\\s+(\\w+)[^{]*extends\\s+(?:Abstract|Base|Injected)?Controller\\b"
    entity_type: Controller
    name_group: 1
    scope: class

  # Action: def actionName = Action { ... } or def actionName = Action.async { ... }
  # Captures the method name
  - pattern: "def\\s+(\\w+)\\s*=\\s*Action(?:\\.async)?\\s*[{(\\[]"
    entity_type: Operation
    name_group: 1
    scope: function

  # Action with block args: def show(id: Long) = Action { ... }
  - pattern: "def\\s+(\\w+)\\s*\\([^)]*\\)\\s*=\\s*Action(?:\\.async)?\\s*[{(\\[]"
    entity_type: Operation
    name_group: 1
    scope: function

  # Play routes file pattern: GET /path controllers.HomeController.index
  # Covers GET, POST, PUT, DELETE, PATCH, HEAD, OPTIONS
  #
  # `(?m)` (#6927). detector.go compiles rule patterns with plain
  # regexp.Compile at :156 and :177, so `^` meant START OF TEXT: the rule found
  # a route only in a routes file whose very first byte is an HTTP verb.
  # Measured over 33 real `conf/routes` files (32 from playframework's own
  # play-samples plus archigraph-corpora's play-scala-starter): those files
  # carry 135 verb-at-column-0 lines between them, of which start-of-text
  # matched 4 (3.0%) — the four whose file opens with a route rather than the
  # usual `# Routes` header. Under `(?m)` it matches 135 of 135.
  #
  # Carries no `$`, so `(?m)`'s other half cannot reach it.
  #
  # NOT gated with requires_framework, and that is measured rather than
  # assumed. Detect resolves rule sets by file.Language, so this pattern is
  # offered only files the classifier calls `scala`; over the 1052 real
  # `.scala`/`.sc` files in that same corpus (http4s, scalatra, play-samples)
  # it matches ZERO times both before and after the change. The specificity is
  # in the rule text, not in the anchor: a column-0 HTTP verb followed by a
  # literal `controllers.` is Play's routes grammar and is not Scala syntax at
  # all. The `^` is still load-bearing for a different reason — see the
  # forbidden rows below — and stays.
  #
  # Named hazard, stated rather than implied: a `.scala` file that embeds a
  # routes table in a triple-quoted string (a router test fixture) WOULD now
  # mint Routes from it. Zero instances in the 1052 files measured, and no
  # framework marker can separate that case from a real routes file, since the
  # embedded text is a real routes table. It is a blind spot, not a defence.
  #
  # Every character before the capture is graded by a forbidden row in
  # internal/engine/play_graphql_multiline_anchor_6927_test.go, and each row
  # names the mutant that mints it:
  #
  #   * `^` — weakening it to `(?m)^[ \t]*` mints a Route for an INDENTED
  #     verb line, which Play's routes parser rejects outright.
  #   * `^` again — deleting it entirely mints a Route for a verb appearing
  #     mid-line, e.g. inside a `#` comment describing a removed route. Play
  #     routes files comment with `#`, and a commented-out route is the most
  #     ordinary thing in one.
  #   * the seven-verb alternation — this is where the rule's specificity
  #     lives, so it is asserted as an EXACT SET, not by membership: adding
  #     `TRACE` mints a Route that no growth ceiling and no membership check
  #     would see, because `TRACE` is a same-shape addition.
  #   * the literal `controllers.` — relaxing it to `\w+\.` mints a Route for
  #     `GET /health services.HealthCheck.ping`, which is a valid routes line
  #     but not a controller route, and the ROUTES_TO edge below would then
  #     point at a target this rule set never emits.
  #
  # UNREACHABLE IN PRODUCTION TODAY, and this fix does not change that.
  # `conf/routes` has no extension and no entry in classifier.go's
  # basenameLanguageMap, so classifyInner returns
  # Skip{unsupported_extension} and the file never reaches the extraction
  # pipeline at all — the same shape as #6946's `.github` finding for the
  # GitHub Actions rules. TestIssue6927_Play_ConfRoutesIsNotClassified pins
  # that, so the day it is fixed this comment is read rather than trusted.
  # Two things wait behind it, both recorded on the reachability issue:
  # internal/custom/scala/frameworks.go already carries its own `rePlayRoute`
  # (with `(?m)`) emitting a RICHER `SCOPE.Operation` "GET:/path" carrying
  # method, path and controller, so this rule would become a second producer
  # of the same fact — the shape #6370 removed the `implements` rule for; and
  # what this rule adds that the extractor does not is the ROUTES_TO edge
  # below, which is the reason it is fixed here rather than deleted.
  - pattern: "(?m)^(?:GET|POST|PUT|DELETE|PATCH|HEAD|OPTIONS)\\s+(\\S+)\\s+controllers\\.(\\w+\\.\\w+)"
    entity_type: Route
    name_group: 1
    scope: file

  # Guice / @Inject constructor DI
  # @Inject()(dep: SomeService)  — captures the type name
  - pattern: "@Inject\\s*\\(\\s*\\)\\s*\\([^)]*?(\\w+Service|\\w+Repository|\\w+Client|\\w+DAO)"
    entity_type: Dependency
    name_group: 1
    scope: class

  # Play module binding: bind[Trait].to[Impl]
  - pattern: "bind\\s*\\[\\s*(\\w+)\\s*\\]"
    entity_type: Service
    name_group: 1
    scope: file

  # Slick model / case class used as table row
  - pattern: "case\\s+class\\s+(\\w+)\\s*\\("
    entity_type: Model
    name_group: 1
    scope: class

relationship_rules:
  # Routes file: HTTP verb + path -> controller action (ROUTES_TO)
  #
  # `(?m)` (#6927), for the same reason and with the same measurement as the
  # Route source_pattern above: 4 of 135 real routes lines before, 135 of 135
  # after. Compiled at detector.go:177, the relationship-rule site, which is a
  # SEPARATE regexp.Compile call from the source-pattern site — so the two
  # halves of this rule had to be fixed independently and are graded
  # independently. This is the edge the entity rule cannot supply on its own,
  # and the reason neither is deleted in favour of
  # internal/custom/scala/frameworks.go's richer route entity.
  - pattern: "(?m)^(?:GET|POST|PUT|DELETE|PATCH|HEAD|OPTIONS)\\s+(\\S+)\\s+controllers\\.(\\w+\\.\\w+)"
    source_type: Route
    target_type: Operation
    relationship: ROUTES_TO
    source_group: 1
    target_group: 2

  # DI injection: Dependency injected into a Controller
  - pattern: "@Inject\\s*\\(\\s*\\)\\s*\\([^)]*?(\\w+Service|\\w+Repository|\\w+Client)[^)]*\\)[^{]*class\\s+(\\w+)"
    source_type: Dependency
    target_type: Controller
    relationship: INJECTED_INTO
    source_group: 1
    target_group: 2
